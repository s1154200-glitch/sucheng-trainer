<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>速成輸入法字形拆碼極速練習器</title>
  <style>
    :root {
      --ink: #15202b;
      --muted: #6d7480;
      --panel: #f8fafc;
      --line: rgba(21, 32, 43, 0.1);
      --key: #ffffff;
      --key-deep: #e9edf3;
      --brand: #1f7a8c;
      --brand-dark: #145667;
      --amber: #efb543;
      --success: #18b66c;
      --danger: #e84b5f;
      --tail: #18b66c;
      --aux-blue: #1f7af0;
      --aux-red: #f71818;
      --aux-orange: #f06918;
      --aux-green: #08b61e;
      --aux-magenta: #d91be8;
      --aux-gold: #e28d15;
      --aux-line-strong: rgba(238, 255, 0, 0.88);
      --shadow: 0 22px 52px rgba(13, 20, 28, 0.22);
      --soft-shadow: 0 10px 28px rgba(25, 40, 55, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(145deg, rgba(31, 122, 140, 0.16), transparent 42%),
        linear-gradient(320deg, rgba(239, 181, 67, 0.18), transparent 38%),
        #dbe2ea;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    button {
      border: 0;
      font: inherit;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      touch-action: manipulation;
      user-select: none;
      cursor: pointer;
    }

    .device-shell {
      width: min(100vw, 412px);
      height: min(100dvh, 884px);
      max-height: 884px;
      position: relative;
      overflow: hidden;
      background: #11151b;
      border: 10px solid #11151b;
      border-radius: 44px;
      box-shadow: var(--shadow);
    }

    .device-shell::before {
      content: "";
      position: absolute;
      z-index: 4;
      top: 9px;
      left: 50%;
      width: 112px;
      height: 28px;
      transform: translateX(-50%);
      border-radius: 0 0 18px 18px;
      background: #11151b;
      pointer-events: none;
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
      border-radius: 34px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(245, 248, 251, 0.99) 58%, #edf2f7);
    }

    .hero {
      min-height: 0;
      position: relative;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 10px;
      padding: calc(env(safe-area-inset-top) + 34px) 22px 16px;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 42px;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .title {
      margin: 0;
      font-size: 16px;
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 850;
      white-space: nowrap;
    }

    .subtitle {
      display: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .top-actions {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.82);
      color: #17202b;
      box-shadow: inset 0 0 0 1px var(--line), 0 9px 20px rgba(16, 23, 31, 0.1);
      transition: transform 150ms ease, background 150ms ease, color 150ms ease, box-shadow 150ms ease;
    }

    .icon-button svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.2;
    }

    .icon-button[aria-expanded="true"] {
      background: #17202b;
      color: #ffffff;
      box-shadow: 0 10px 22px rgba(16, 23, 31, 0.18);
    }

    .icon-button:active {
      transform: scale(0.95) translateY(1px);
    }

    .settings-menu {
      position: absolute;
      z-index: 8;
      top: calc(100% + 10px);
      right: 0;
      width: min(264px, calc(100vw - 44px));
      padding: 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.86);
      box-shadow: 0 20px 44px rgba(16, 23, 31, 0.2), inset 0 0 0 1px var(--line);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px) scale(0.98);
      transform-origin: top right;
      transition: opacity 160ms ease, transform 160ms ease;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .settings-menu.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .settings-menu-title {
      margin: 0 0 10px;
      color: #17202b;
      font-size: 13px;
      line-height: 1;
      font-weight: 950;
    }

    .settings-row {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 10px;
      border-radius: 16px;
      background: rgba(244, 247, 250, 0.96);
      color: var(--muted);
      box-shadow: inset 0 0 0 1px var(--line);
      font-size: 13px;
      line-height: 1;
      font-weight: 850;
    }

    .settings-row select {
      width: 92px;
      border: 0;
      outline: 0;
      border-radius: 13px;
      padding: 8px 28px 8px 10px;
      background: #17202b;
      color: #ffffff;
      font: inherit;
      font-size: 13px;
      -webkit-tap-highlight-color: transparent;
    }

    .menu-button {
      width: 100%;
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      padding: 0 12px;
      border-radius: 16px;
      background: rgba(31, 122, 140, 0.1);
      color: var(--brand-dark);
      box-shadow: inset 0 0 0 1px rgba(31, 122, 140, 0.16);
      font-size: 13px;
      font-weight: 950;
      transition: transform 150ms ease, background 150ms ease;
    }

    .menu-button svg {
      width: 17px;
      height: 17px;
      stroke-width: 2.3;
    }

    .menu-button:active {
      transform: scale(0.98) translateY(1px);
      background: rgba(31, 122, 140, 0.15);
    }

    .reset-button {
      width: 100%;
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      border-radius: 16px;
      background: rgba(232, 75, 95, 0.1);
      color: var(--danger);
      box-shadow: inset 0 0 0 1px rgba(232, 75, 95, 0.18);
      font-size: 13px;
      font-weight: 950;
      transition: transform 150ms ease, background 150ms ease;
    }

    .reset-button:active {
      transform: scale(0.98) translateY(1px);
      background: rgba(232, 75, 95, 0.15);
    }

    .record-panel {
      position: absolute;
      z-index: 10;
      inset: 0;
      display: grid;
      align-items: end;
      background: rgba(17, 21, 27, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .record-panel.show {
      opacity: 1;
      pointer-events: auto;
    }

    .record-sheet {
      max-height: min(76dvh, 650px);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 12px;
      padding: 16px 14px calc(env(safe-area-inset-bottom) + 16px);
      border-radius: 26px 26px 0 0;
      background: rgba(248, 250, 252, 0.98);
      box-shadow: 0 -22px 50px rgba(16, 23, 31, 0.24);
      transform: translateY(16px);
      transition: transform 180ms ease;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .record-panel.show .record-sheet {
      transform: translateY(0);
    }

    .record-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .record-title {
      margin: 0;
      color: #17202b;
      font-size: 17px;
      line-height: 1.1;
      font-weight: 950;
    }

    .record-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
      font-weight: 800;
    }

    .record-close {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 14px;
      background: #17202b;
      color: #ffffff;
      box-shadow: 0 10px 20px rgba(16, 23, 31, 0.16);
    }

    .record-close svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.5;
    }

    .record-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .record-stat {
      min-width: 0;
      padding: 8px 6px;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px var(--line);
      text-align: center;
    }

    .record-stat strong,
    .record-stat span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .record-stat strong {
      color: #17202b;
      font-size: 16px;
      line-height: 1;
      font-weight: 950;
    }

    .record-stat span {
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1;
      font-weight: 850;
    }

    .record-table-wrap {
      min-height: 0;
      overflow: auto;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .record-table {
      width: 100%;
      min-width: 690px;
      border-collapse: collapse;
      color: #17202b;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 800;
    }

    .record-table th,
    .record-table td {
      padding: 10px 9px;
      border-bottom: 1px solid rgba(21, 32, 43, 0.08);
      text-align: left;
      white-space: nowrap;
    }

    .record-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #eef3f7;
      color: var(--muted);
      font-size: 11px;
      font-weight: 950;
    }

    .record-sort-head {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .record-sort-button {
      width: 14px;
      min-width: 14px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0;
      border-radius: 4px;
      background: transparent;
      color: #17202b;
      line-height: 1;
      opacity: 0.72;
      transition: transform 140ms ease, color 140ms ease, opacity 140ms ease;
    }

    .record-sort-button::before,
    .record-sort-button::after {
      content: "";
      position: absolute;
      left: 50%;
      width: 4px;
      height: 4px;
      border-right: 1.4px solid currentColor;
      border-bottom: 1.4px solid currentColor;
      opacity: 0.34;
      transform-origin: center;
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .record-sort-button::before {
      top: 3px;
      transform: translateX(-50%) rotate(225deg);
    }

    .record-sort-button::after {
      bottom: 3px;
      transform: translateX(-50%) rotate(45deg);
    }

    .record-sort-button[aria-pressed="true"][data-direction="asc"]::before,
    .record-sort-button[aria-pressed="true"][data-direction="desc"]::after {
      opacity: 1;
      transform: translateX(-50%) rotate(var(--sort-rotate, 45deg)) scale(1.08);
    }

    .record-sort-button[aria-pressed="true"][data-direction="asc"]::before {
      --sort-rotate: 225deg;
    }

    .record-sort-button[aria-pressed="true"][data-direction="desc"]::after {
      --sort-rotate: 45deg;
    }

    .record-sort-button[aria-pressed="true"] {
      color: #17202b;
      opacity: 1;
    }

    .record-sort-button:hover {
      opacity: 1;
    }

    .record-sort-button:active {
      transform: translateY(1px) scale(0.92);
    }

    .record-table tr:last-child td {
      border-bottom: 0;
    }

    .record-char {
      font-size: 20px;
      line-height: 1;
      font-weight: 950;
    }

    .record-empty {
      padding: 28px 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      font-weight: 850;
      text-align: center;
    }

    .decomposition-search {
      position: relative;
      z-index: 9;
      display: grid;
      width: 100%;
      max-width: 184px;
      min-width: 0;
      justify-self: center;
    }

    .search-box {
      min-height: 40px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 6px;
      padding: 0 6px 0 12px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: inset 0 0 0 1px var(--line), 0 9px 20px rgba(16, 23, 31, 0.1);
      transition: background 150ms ease, box-shadow 150ms ease, transform 150ms ease;
      overflow: hidden;
    }

    .search-icon {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      color: #17202b;
      stroke-width: 2.2;
      pointer-events: none;
    }

    .search-input {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 9px 2px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      line-height: 1;
      font-weight: 850;
    }

    .search-input::placeholder {
      color: rgba(109, 116, 128, 0.78);
    }

    .search-input::-webkit-search-decoration,
    .search-input::-webkit-search-cancel-button,
    .search-input::-webkit-search-results-button,
    .search-input::-webkit-search-results-decoration {
      display: none;
      -webkit-appearance: none;
    }

    .search-clear {
      width: 26px;
      height: 26px;
      display: none;
      place-items: center;
      border-radius: 10px;
      background: rgba(21, 32, 43, 0.06);
      color: #17202b;
      font-size: 15px;
      line-height: 1;
      font-weight: 950;
    }

    .search-clear.show {
      display: grid;
    }

    .search-clear:active {
      transform: scale(0.94);
    }

    .decomposition-result {
      display: none;
    }

    .decomposition-result.show {
      display: grid;
      animation: slideIn 180ms ease both;
    }

    .decomposition-result-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .search-character {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #17202b;
      color: #ffffff;
      font-size: 30px;
      line-height: 1;
      font-weight: 950;
      box-shadow: 0 10px 20px rgba(16, 23, 31, 0.16);
    }

    .search-summary {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .search-title {
      color: #17202b;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 950;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .search-subtitle {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.25;
      font-weight: 800;
    }

    .search-confidence {
      padding: 5px 7px;
      border-radius: 999px;
      background: rgba(24, 182, 108, 0.12);
      color: #0b7f48;
      font-size: 10px;
      line-height: 1;
      font-weight: 950;
      white-space: nowrap;
    }

    .search-confidence.is-partial {
      background: rgba(239, 181, 67, 0.18);
      color: #8b5a06;
    }

    .search-confidence.is-code {
      background: rgba(31, 122, 240, 0.12);
      color: #155fb8;
    }

    .search-confidence.is-missing {
      background: rgba(232, 75, 95, 0.12);
      color: var(--danger);
    }

    .code-breakdown {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .code-piece {
      min-width: 0;
      display: grid;
      gap: 3px;
      padding: 8px;
      border-radius: 14px;
      background: rgba(245, 248, 251, 0.98);
      box-shadow: inset 0 0 0 1px rgba(21, 32, 43, 0.08);
    }

    .code-piece-role {
      color: var(--muted);
      font-size: 10px;
      line-height: 1;
      font-weight: 950;
    }

    .code-piece-value {
      color: #17202b;
      font-size: 24px;
      line-height: 1.15;
      font-weight: 950;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .decomposition-note {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
      font-weight: 800;
    }

    .study-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 0;
    }

    .memory-chip {
      width: 100%;
      min-width: 0;
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.84);
      color: var(--muted);
      box-shadow: inset 0 0 0 1px var(--line), 0 8px 18px rgba(25, 40, 55, 0.06);
      font-size: 12px;
      line-height: 1;
      font-weight: 850;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .study-strip.learn-more-ready .memory-chip {
      justify-content: flex-start;
    }

    .learn-more-button {
      flex: 0 0 auto;
      min-height: 34px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(31, 122, 140, 0.12);
      color: var(--brand-dark);
      box-shadow: inset 0 0 0 1px rgba(31, 122, 140, 0.18);
      font-size: 12px;
      line-height: 1;
      font-weight: 950;
      white-space: nowrap;
      transition: transform 150ms ease, background 150ms ease;
    }

    .learn-more-button.show {
      display: inline-flex;
    }

    .learn-more-button:active {
      transform: scale(0.97) translateY(1px);
      background: rgba(31, 122, 140, 0.18);
    }

    .character-stage {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 10px 0 12px;
    }

    .character-card {
      width: 100%;
      display: grid;
      justify-items: center;
      gap: 16px;
    }

    .prompt-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .round-mark {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--brand);
    }

    .word-wrap {
      width: 220px;
      height: clamp(144px, 26dvh, 224px);
      display: grid;
      place-items: center;
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.42) 52%, transparent 70%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(230, 236, 243, 0.5));
      box-shadow: var(--soft-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.72);
    }

    .word {
      display: inline-block;
      font-size: clamp(104px, 29dvw, 148px);
      line-height: 1;
      font-weight: 900;
      color: var(--ink);
      text-align: center;
      text-shadow: 0 10px 26px rgba(30, 43, 57, 0.16);
      transform-origin: center;
      will-change: transform, color;
    }

    .word.entering {
      animation: wordIn 360ms cubic-bezier(0.2, 0.8, 0.25, 1);
    }

    .word.correct {
      color: var(--success);
      animation: pop 480ms cubic-bezier(0.18, 1.35, 0.32, 1);
    }

    .word.shake {
      animation: shake 420ms cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    .word.complete {
      font-size: 46px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .hero.answer-mode {
      grid-template-rows: auto 0 minmax(0, 1fr) auto;
      gap: 6px;
    }

    .hero.search-mode {
      grid-template-rows: auto 0 minmax(0, 1fr) 0;
      gap: 6px;
    }

    .hero.answer-mode + .keyboard {
      display: none;
    }

    .hero.search-mode + .keyboard {
      display: none;
    }

    .hero.answer-mode .study-strip {
      min-height: 0;
      height: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .hero.search-mode .study-strip,
    .hero.search-mode .hint-button {
      min-height: 0;
      height: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      margin: 0;
    }

    .hero.answer-mode .decomposition-result.show {
      display: none;
    }

    .hero.search-mode .decomposition-result.show {
      opacity: 0.9;
    }

    .hero.answer-mode .character-card {
      gap: 6px;
    }

    .hero.search-mode .character-card {
      gap: 6px;
    }

    .hero.answer-mode .character-stage {
      align-items: start;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 4px 0 10px;
      scrollbar-width: none;
    }

    .hero.search-mode .character-stage {
      align-items: start;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 4px 0 10px;
      scrollbar-width: none;
    }

    .hero.answer-mode .character-stage::-webkit-scrollbar {
      display: none;
    }

    .hero.search-mode .character-stage::-webkit-scrollbar {
      display: none;
    }

    .hero.answer-mode .prompt-meta {
      font-size: 12px;
    }

    .hero.search-mode .prompt-meta {
      font-size: 12px;
    }

    .hero.answer-mode .buffer-label,
    .hero.answer-mode .input-row {
      display: none;
    }

    .hero.search-mode .buffer-label,
    .hero.search-mode .input-row {
      display: none;
    }

    .buffer-panel {
      width: 100%;
      display: grid;
      gap: 9px;
      justify-items: center;
    }

    .buffer-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .buffer {
      display: grid;
      grid-template-columns: repeat(2, 76px);
      gap: 10px;
      min-height: 58px;
    }

    .input-row {
      display: grid;
      grid-template-columns: auto 58px;
      align-items: center;
      gap: 10px;
    }

    .slot {
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: inset 0 0 0 1px var(--line), 0 10px 22px rgba(25, 40, 55, 0.08);
      color: #a2acb8;
      font-size: 24px;
      font-weight: 900;
      transition: transform 170ms ease, background 170ms ease, color 170ms ease;
    }

    .slot.filled {
      background: #17202b;
      color: #ffffff;
      transform: translateY(-2px) scale(1.03);
    }

    .slot.bad {
      background: rgba(232, 75, 95, 0.14);
      color: var(--danger);
      box-shadow: inset 0 0 0 1px rgba(232, 75, 95, 0.22);
    }

    .slot small {
      display: block;
      margin-top: -3px;
      color: inherit;
      opacity: 0.72;
      font-size: 11px;
      line-height: 1;
      font-weight: 800;
    }

    .delete-button {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 0 0 1px var(--line), 0 10px 22px rgba(25, 40, 55, 0.08);
      color: #17202b;
      font-size: 13px;
      line-height: 1;
      font-weight: 900;
      transition: transform 140ms ease, opacity 140ms ease, background 140ms ease;
    }

    .delete-button:active:not(:disabled) {
      transform: translateY(2px) scale(0.96);
      background: #f7fbff;
    }

    .delete-button:disabled {
      cursor: default;
      opacity: 0.38;
    }

    .answer-line {
      width: min(100%, 360px);
      height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
      justify-content: center;
      gap: 10px;
      opacity: 0;
      overflow: hidden;
      transform: translateY(5px);
      transition: height 180ms ease, opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .answer-line.show {
      height: clamp(260px, 42dvh, 330px);
      opacity: 1;
      transform: translateY(0);
    }

    .answer-line.single {
      grid-template-columns: minmax(0, 1fr);
    }

    .answer-card {
      min-width: 0;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 7px;
      justify-items: center;
    }

    .answer-mode .word-wrap {
      width: min(58vw, 228px);
      height: clamp(144px, 24dvh, 184px);
    }

    .answer-mode .word {
      font-size: clamp(104px, 29dvw, 148px);
    }

    .search-mode .word-wrap {
      width: min(58vw, 228px);
      height: clamp(144px, 24dvh, 184px);
    }

    .search-mode .word {
      font-size: clamp(104px, 29dvw, 148px);
    }

    .answer-card.head {
      color: var(--danger);
    }

    .answer-card.tail {
      color: var(--tail);
    }

    .answer-label {
      min-width: 0;
      font-size: 12px;
      line-height: 1.2;
      color: currentColor;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .answer-card-img-wrap {
      min-height: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      align-self: stretch;
      overflow: visible;
    }

    .answer-card-img {
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .answer-card-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 12px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.35;
      font-weight: 850;
      text-align: center;
    }

    .answer-search-empty {
      width: min(100%, 320px);
      min-height: 128px;
      display: grid;
      place-items: center;
      padding: 18px 20px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: inset 0 0 0 1px var(--line), 0 12px 26px rgba(25, 40, 55, 0.08);
      color: #31404f;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 850;
      text-align: center;
    }

    .aux-card {
      width: 128px;
      height: 202px;
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border-radius: 16px;
      border: 2px solid var(--aux-line-strong);
      background: #fbfcf8;
      color: #101217;
      overflow: hidden;
      box-shadow: 0 10px 22px rgba(25, 40, 55, 0.12);
    }

    .aux-card-head {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding-top: 5px;
    }

    .aux-badge-pair {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
    }

    .aux-root-badge,
    .aux-letter-badge {
      height: 28px;
      min-width: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 7px;
      border-radius: 6px;
      color: #ffffff;
      font-size: 18px;
      line-height: 1;
      font-weight: 950;
    }

    .aux-letter-badge {
      background: var(--aux-blue);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 20px;
    }

    .aux-card-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(var(--aux-glyph-cols, 4), minmax(0, 1fr));
      grid-auto-rows: var(--aux-glyph-size, 33px);
      align-content: start;
      gap: var(--aux-glyph-gap-y, 3px) var(--aux-glyph-gap-x, 3px);
      padding: 2px 7px 8px;
      overflow: hidden;
    }

    .aux-card-glyph-wrap {
      width: min(var(--aux-glyph-size, 33px), 100%);
      height: min(var(--aux-glyph-size, 33px), 100%);
      display: grid;
      place-items: center;
      margin: auto;
      border-radius: 10px;
      transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease, color 150ms ease, filter 150ms ease;
    }

    .aux-card-glyph {
      width: min(var(--aux-glyph-size, 33px), 100%);
      height: min(var(--aux-glyph-size, 33px), 100%);
      display: block;
      margin: auto;
      object-fit: contain;
      filter: contrast(1.05);
    }

    .aux-text-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-content: start;
      grid-auto-rows: 30px;
      gap: 8px;
      padding: 6px 10px 10px;
      overflow: hidden;
    }

    .aux-text-grid.is-note {
      grid-template-columns: minmax(0, 1fr);
      grid-auto-rows: auto;
      align-content: start;
      padding-inline: 12px;
      padding-top: 8px;
    }

    .aux-description-cell {
      grid-column: 1 / -1;
      align-self: start;
      padding: 2px 2px 0;
      color: #171a20;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 900;
      text-align: center;
      word-break: keep-all;
      transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease, color 150ms ease;
    }

    .hint-button {
      width: 100%;
      min-height: 50px;
      position: relative;
      z-index: 2;
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border-radius: 18px;
      background: #17202b;
      color: #ffffff;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 14px 28px rgba(16, 23, 31, 0.2);
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .hint-button.next {
      background: var(--brand-dark);
      box-shadow: 0 14px 28px rgba(31, 122, 140, 0.22);
    }

    .hint-button:active {
      transform: scale(0.985) translateY(1px);
      background: #222d39;
      box-shadow: 0 8px 18px rgba(16, 23, 31, 0.16);
    }

    .keyboard {
      position: relative;
      padding: 14px 9px calc(env(safe-area-inset-bottom) + 12px);
      background:
        linear-gradient(180deg, rgba(235, 241, 247, 0.96), #d8e0e8),
        #dce4ec;
      border-top: 1px solid rgba(21, 32, 43, 0.08);
      box-shadow: 0 -14px 32px rgba(25, 40, 55, 0.08);
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
    }

    .key-hint {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: calc(100% + 10px);
      width: auto;
      max-width: calc(100% - 34px);
      display: grid;
      justify-items: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px) scale(0.96);
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .key-hint.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    .key-hint-card {
      display: block;
      margin: 0 auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .key-hint-fallback {
      padding: 14px;
      border-radius: 14px;
      background: rgba(23, 32, 43, 0.96);
      color: #ffffff;
      box-shadow: 0 16px 34px rgba(16, 23, 31, 0.22);
      font-size: 15px;
      line-height: 1.35;
      font-weight: 850;
      text-align: center;
    }

    .key-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 7px;
    }

    .key-row:last-child {
      margin-bottom: 0;
    }

    .key {
      flex: 0 0 min(32px, calc((100% - 54px) / 10));
      min-width: 0;
      height: 48px;
      display: grid;
      place-items: center;
      gap: 0;
      border-radius: 12px;
      color: var(--ink);
      background: var(--key);
      box-shadow:
        0 3px 0 var(--key-deep),
        0 8px 16px rgba(25, 40, 55, 0.13);
      transition: transform 92ms ease, box-shadow 92ms ease, background 120ms ease;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
    }

    .key:active,
    .key.active,
    .key.holding {
      transform: translateY(3px) scale(0.96);
      background: #f7fbff;
      box-shadow:
        0 0 0 var(--key-deep),
        0 4px 9px rgba(25, 40, 55, 0.12);
    }

    .key-letter {
      display: block;
      margin-top: 2px;
      font-size: 18px;
      line-height: 1;
      font-weight: 950;
      pointer-events: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .key-root {
      display: block;
      margin-top: -1px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
      font-weight: 850;
      pointer-events: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    @keyframes wordIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pop {
      0% {
        transform: scale(1);
      }
      42% {
        transform: scale(1.18);
      }
      70% {
        transform: scale(0.96);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes shake {
      0%, 100% {
        transform: translateX(0);
      }
      15% {
        transform: translateX(-10px) rotate(-1.5deg);
      }
      30% {
        transform: translateX(9px) rotate(1.4deg);
      }
      45% {
        transform: translateX(-7px) rotate(-1.2deg);
      }
      60% {
        transform: translateX(6px) rotate(1deg);
      }
      75% {
        transform: translateX(-3px) rotate(-0.7deg);
      }
    }

    @media (max-width: 480px) {
      body {
        background: #11151b;
      }

      .device-shell {
        width: 100vw;
        height: 100dvh;
        max-height: none;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .device-shell::before {
        display: none;
      }

      .app {
        border-radius: 0;
      }

      .word-wrap {
        width: min(58vw, 228px);
      }
    }

    @media (max-height: 720px) {
      .hero {
        padding-top: calc(env(safe-area-inset-top) + 20px);
        padding-bottom: 10px;
      }

      .character-card {
        gap: 9px;
      }

      .word-wrap {
        height: 132px;
      }

      .word {
        font-size: 100px;
      }

      .buffer {
        min-height: 50px;
      }

      .slot {
        height: 50px;
      }

      .input-row {
        grid-template-columns: auto 52px;
      }

      .delete-button {
        width: 52px;
        height: 50px;
        border-radius: 16px;
      }

      .answer-line.show {
        height: clamp(252px, 46dvh, 300px);
      }

      .answer-card {
        height: 100%;
      }

      .answer-label {
        font-size: 11px;
      }

      .keyboard {
        padding-top: 10px;
      }

      .key {
        height: 43px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="device-shell" aria-label="速成輸入法字形拆碼極速練習器">
    <section class="app">
      <div class="hero">
        <header class="topbar">
          <div class="title-block">
            <h1 class="title">速成拆碼</h1>
            <div class="subtitle">頭碼 · 尾碼</div>
          </div>
          <div class="top-actions">
            <form id="decompositionSearch" class="decomposition-search" role="search" autocomplete="off">
              <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="10.5" cy="10.5" r="6.5"></circle>

              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3.2"></circle>
                <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 0 1-4 0v-.08a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 0 1 0-4h.08A1.7 1.7 0 0 0 4.6 8.94a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 10 3.08V3a2 2 0 0 1 4 0v.08a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 0 1 0 4h-.08A1.7 1.7 0 0 0 19.4 15Z"></path>
              </svg>
            </button>

                  <path d="M8 12h13"></path>
                  <path d="M8 18h13"></path>
                  <path d="M3 6h.01"></path>
                  <path d="M3 12h.01"></path>
                  <path d="M3 18h.01"></path>
                </svg>
              </button>
              <button id="resetProgressButton" class="reset-button" type="button">重設學習紀錄</button>
            </div>
          </div>
        </header>

        <div class="study-strip">
          <div id="memoryText" class="memory-chip" aria-live="polite">新字 0 · 複習 0</div>
          <button id="learnMoreButton" class="learn-more-button" type="button">學更多新字</button>

  </main>

  <script>
    const COMMONS_FILE = "https://commons.wikimedia.org/wiki/Special:Redirect/file/";

    function createSequentialId(prefix, index) {
      return `${prefix}-${String(index).padStart(2, "0")}`;
    }

    const MAIN_ROOTS = [
      { id: "main-01", letter: "Q", text: "手" },
      { id: "main-02", letter: "W", text: "田" },
      { id: "main-03", letter: "E", text: "水" },

      { id: "main-05", letter: "T", text: "廿" },
      { id: "main-06", letter: "Y", text: "卜" },
      { id: "main-07", letter: "U", text: "山" },
      { id: "main-08", letter: "I", text: "戈" },
      { id: "main-09", letter: "O", text: "人" },
      { id: "main-10", letter: "P", text: "心" },
      { id: "main-11", letter: "A", text: "日" },
      { id: "main-12", letter: "S", text: "尸" },

      { id: "main-15", letter: "G", text: "土" },
