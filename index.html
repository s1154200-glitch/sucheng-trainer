<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>速成｜輸入法字形拆碼極速練習器</title>
  <style>
    :root {
      --ink: #15202b;
      --muted: #6d7480;
      --panel: #f8fafc;
      --line: rgba(21, 32, 43, 0.1);
      --key: #ffffff;
      --key-deep: #e9edf3;
      --brand: #1f7a8c;
      --brand-dark: #145667;
      --amber: #efb543;
      --success: #18b66c;
      --danger: #e84b5f;
      --tail: #18b66c;
      --aux-blue: #1f7af0;
      --aux-red: #f71818;
      --aux-orange: #f06918;
      --aux-green: #08b61e;
      --aux-magenta: #d91be8;
      --aux-gold: #e28d15;
      --aux-line-strong: rgba(238, 255, 0, 0.88);
      --shadow: 0 22px 52px rgba(13, 20, 28, 0.22);
      --soft-shadow: 0 10px 28px rgba(25, 40, 55, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(145deg, rgba(31, 122, 140, 0.16), transparent 42%),
        linear-gradient(320deg, rgba(239, 181, 67, 0.18), transparent 38%),
        #dbe2ea;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    button {
      border: 0;
      font: inherit;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      touch-action: manipulation;
      user-select: none;
      cursor: pointer;
    }

    .device-shell {
      width: min(100vw, 412px);
      height: min(100dvh, 884px);
      max-height: 884px;
      position: relative;
      overflow: hidden;
      background: #11151b;
      border: 10px solid #11151b;
      border-radius: 44px;
      box-shadow: var(--shadow);
    }

    .device-shell::before {
      content: "";
      position: absolute;
      z-index: 4;
      top: 9px;
      left: 50%;
      width: 112px;
      height: 28px;
      transform: translateX(-50%);
      border-radius: 0 0 18px 18px;
      background: #11151b;
      pointer-events: none;
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
      border-radius: 34px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(245, 248, 251, 0.99) 58%, #edf2f7);
    }

    .hero {
      min-height: 0;
      position: relative;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto;
      gap: 10px;
      padding: calc(env(safe-area-inset-top) + 34px) 22px 16px 20px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 42px;
    }

    .title-block {
      display: flex;
      align-items: center;
    }

    .logo-wordmark {
      margin: 0;
      display: inline-flex;
      align-items: center;
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .logo-image {
      display: block;
      width: 50px;
      height: auto;
      max-width: 25vw;
    }

    .top-actions {
      position: relative;
      z-index: 12;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex: 0 0 auto;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      justify-items: start;
      padding-right: 0;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: transparent;
      color: #17202b;
      box-shadow: none;
      transition: transform 150ms ease, color 150ms ease, opacity 150ms ease;
    }

    .icon-button svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.2;
      transform: translateX(10px);
    }

    .icon-button[aria-expanded="true"] {
      color: #17202b;
      opacity: 0.86;
    }

    .icon-button:active {
      transform: scale(0.95) translateY(1px);
    }

    .settings-menu {
      position: absolute;
      z-index: 14;
      top: calc(100% + 10px);
      right: 0;
      width: min(264px, calc(100vw - 44px));
      padding: 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.86);
      box-shadow: 0 20px 44px rgba(16, 23, 31, 0.2), inset 0 0 0 1px var(--line);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px) scale(0.98);
      transform-origin: top right;
      transition: opacity 160ms ease, transform 160ms ease;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .settings-menu.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .settings-menu-title {
      margin: 0 0 10px;
      color: #17202b;
      font-size: 13px;
      line-height: 1;
      font-weight: 950;
    }

    .settings-row {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 10px;
      border-radius: 16px;
      background: rgba(244, 247, 250, 0.96);
      color: var(--muted);
      box-shadow: inset 0 0 0 1px var(--line);
      font-size: 13px;
      line-height: 1;
      font-weight: 850;
    }

    .settings-row + .settings-row {
      margin-top: 10px;
    }

    .settings-row-daily {
      min-height: auto;
      align-items: stretch;
      padding: 10px;
    }

    .settings-row-daily-content {
      width: 100%;
      display: grid;
      gap: 10px;
    }

    .settings-row-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: inherit;
    }

    .settings-row-title {
      font-size: 13px;
      line-height: 1;
      font-weight: 850;
    }

    .settings-row-note {
      color: #8993a0;
      font-size: 11px;
      line-height: 1;
      font-weight: 820;
      white-space: nowrap;
    }

    .settings-choice-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 4px;
      padding: 3px;
      border-radius: 15px;
      background: rgba(23, 32, 43, 0.08);
      box-shadow: inset 0 0 0 1px rgba(21, 32, 43, 0.05);
    }

    .settings-choice {
      min-width: 0;
      min-height: 30px;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      line-height: 1;
      font-weight: 950;
      transition: transform 150ms ease, background 150ms ease, color 150ms ease, box-shadow 150ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .settings-choice.is-active {
      background: #17202b;
      color: #ffffff;
      box-shadow: 0 6px 14px rgba(16, 23, 31, 0.13);
    }

    .settings-choice:active {
      transform: scale(0.96);
    }

    .settings-choice:focus-visible,
    .settings-switch:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(31, 122, 140, 0.16);
    }

    .settings-switch {
      width: 116px;
      height: 36px;
      display: inline-block;
      position: relative;
      padding: 3px;
      border-radius: 15px;
      background: rgba(23, 32, 43, 0.08);
      box-shadow: inset 0 0 0 1px rgba(21, 32, 43, 0.05);
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      line-height: 1;
      font-weight: 950;
      -webkit-tap-highlight-color: transparent;
      transition: transform 150ms ease, background 150ms ease;
    }

    .settings-switch-track {
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      position: relative;
    }

    .settings-switch-option {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      height: 30px;
      color: var(--muted);
      transition: color 180ms ease;
    }

    .settings-switch-thumb {
      position: absolute;
      z-index: 0;
      top: 0;
      left: 0;
      width: 50%;
      height: 30px;
      border-radius: 12px;
      background: #17202b;
      box-shadow: 0 6px 14px rgba(16, 23, 31, 0.13);
      transform: translateX(0);
      transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 180ms ease;
    }

    .settings-switch:not(.is-random) .settings-switch-option:first-child,
    .settings-switch.is-random .settings-switch-option:nth-child(2) {
      color: #ffffff;
    }

    .settings-switch.is-random .settings-switch-thumb {
      transform: translateX(100%);
    }

    .settings-switch:active {
      transform: scale(0.96);
    }

    .menu-button {
      width: 100%;
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      padding: 0 12px;
      border-radius: 16px;
      background: rgba(31, 122, 140, 0.1);
      color: var(--brand-dark);
      box-shadow: inset 0 0 0 1px rgba(31, 122, 140, 0.16);
      font-size: 13px;
      font-weight: 950;
      transition: transform 150ms ease, background 150ms ease;
    }

    .menu-button svg {
      width: 17px;
      height: 17px;
      stroke-width: 2.3;
    }

    .menu-button:active {
      transform: scale(0.98) translateY(1px);
      background: rgba(31, 122, 140, 0.15);
    }

    .reset-button {
      width: 100%;
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      border-radius: 16px;
      background: rgba(232, 75, 95, 0.1);
      color: var(--danger);
      box-shadow: inset 0 0 0 1px rgba(232, 75, 95, 0.18);
      font-size: 13px;
      font-weight: 950;
      transition: transform 150ms ease, background 150ms ease;
    }

    .reset-button:active {
      transform: scale(0.98) translateY(1px);
      background: rgba(232, 75, 95, 0.15);
    }

    .record-panel {
      position: absolute;
      z-index: 10;
      inset: 0;
      display: grid;
      align-items: end;
      background: rgba(17, 21, 27, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .record-panel.show {
      opacity: 1;
      pointer-events: auto;
    }

    .record-sheet {
      max-height: min(76dvh, 650px);
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      gap: 12px;
      padding: 16px 14px calc(env(safe-area-inset-bottom) + 16px);
      border-radius: 26px 26px 0 0;
      background: rgba(248, 250, 252, 0.98);
      box-shadow: 0 -22px 50px rgba(16, 23, 31, 0.24);
      transform: translateY(16px);
      transition: transform 180ms ease;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .record-panel.show .record-sheet {
      transform: translateY(0);
    }

    .record-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .record-title {
      margin: 0;
      color: #17202b;
      font-size: 17px;
      line-height: 1.1;
      font-weight: 950;
    }

    .record-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
      font-weight: 800;
    }

    .dictionary-subtitle-row {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .dictionary-source-hint {
      margin-top: 3px;
      display: inline-flex;
      align-items: center;
    }

    .dictionary-source-link {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      background: #8d96a0;
      box-shadow: none;
      font-size: 8px;
      line-height: 1;
      font-weight: 900;
      opacity: 1;
      text-decoration: none;
      transition: transform 140ms ease, background 140ms ease;
    }

    .dictionary-source-link:hover,
    .dictionary-source-link:focus-visible,
    .dictionary-source-hint:hover .dictionary-source-link,
    .dictionary-source-hint:focus-within .dictionary-source-link {
      color: #ffffff;
      background: #7c8691;
    }

    .dictionary-source-link:active {
      transform: translateY(1px) scale(0.95);
    }

    .dictionary-source-hint[hidden] {
      display: none;
    }

    .record-close {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 14px;
      background: #17202b;
      color: #ffffff;
      box-shadow: 0 10px 20px rgba(16, 23, 31, 0.16);
    }

    .record-close svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.5;
    }

    .record-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .record-stat {
      min-width: 0;
      padding: 8px 6px;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px var(--line);
      text-align: center;
    }

    .record-stat strong,
    .record-stat span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .record-stat strong {
      color: #17202b;
      font-size: 16px;
      line-height: 1;
      font-weight: 950;
    }

    .record-stat span {
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1;
      font-weight: 850;
    }

    .record-tools {
      display: grid;
      gap: 7px;
    }

    .record-actions {
      display: flex;
      gap: 8px;
    }

    .record-action-button {
      flex: 1 1 0;
      min-width: 0;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border-radius: 14px;
      background: rgba(31, 122, 140, 0.1);
      color: var(--brand-dark);
      box-shadow: inset 0 0 0 1px rgba(31, 122, 140, 0.16);
      font-size: 12px;
      line-height: 1.1;
      font-weight: 950;
      text-align: center;
      transition: transform 150ms ease, background 150ms ease;
    }

    .record-action-button:active {
      transform: scale(0.98) translateY(1px);
      background: rgba(31, 122, 140, 0.15);
    }

    .record-status {
      min-height: 14px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
      font-weight: 850;
    }

    .record-table-wrap {
      min-height: 0;
      overflow: auto;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .record-table {
      width: 100%;
      min-width: 690px;
      border-collapse: collapse;
      color: #17202b;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 800;
    }

    .record-table th,
    .record-table td {
      padding: 10px 9px;
      border-bottom: 1px solid rgba(21, 32, 43, 0.08);
      text-align: left;
      white-space: nowrap;
    }

    .record-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #eef3f7;
      color: var(--muted);
      font-size: 11px;
      font-weight: 950;
    }

    .record-sort-head {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .record-sort-button {
      width: 14px;
      min-width: 14px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0;
      border-radius: 4px;
      background: transparent;
      color: #17202b;
      line-height: 1;
      opacity: 0.72;
      transition: transform 140ms ease, color 140ms ease, opacity 140ms ease;
    }

    .record-sort-button::before,
    .record-sort-button::after {
      content: "";
      position: absolute;
      left: 50%;
      width: 4px;
      height: 4px;
      border-right: 1.4px solid currentColor;
      border-bottom: 1.4px solid currentColor;
      opacity: 0.34;
      transform-origin: center;
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .record-sort-button::before {
      top: 3px;
      transform: translateX(-50%) rotate(225deg);
    }

    .record-sort-button::after {
      bottom: 3px;
      transform: translateX(-50%) rotate(45deg);
    }

    .record-sort-button[aria-pressed="true"][data-direction="asc"]::before,
    .record-sort-button[aria-pressed="true"][data-direction="desc"]::after {
      opacity: 1;
      transform: translateX(-50%) rotate(var(--sort-rotate, 45deg)) scale(1.08);
    }

    .record-sort-button[aria-pressed="true"][data-direction="asc"]::before {
      --sort-rotate: 225deg;
    }

    .record-sort-button[aria-pressed="true"][data-direction="desc"]::after {
      --sort-rotate: 45deg;
    }

    .record-sort-button[aria-pressed="true"] {
      color: #17202b;
      opacity: 1;
    }

    .record-sort-button:hover {
      opacity: 1;
    }

    .record-sort-button:active {
      transform: translateY(1px) scale(0.92);
    }

    .record-table tr:last-child td {
      border-bottom: 0;
    }

    .record-char {
      font-size: 20px;
      line-height: 1;
      font-weight: 950;
    }

    .record-empty {
      padding: 28px 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      font-weight: 850;
      text-align: center;
    }

    .analysis-panel {
      z-index: 12;
    }

    .analysis-sheet {
      max-height: min(84dvh, 720px);
      grid-template-rows: auto auto minmax(0, 1fr);
    }

    .analysis-overview {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .analysis-content {
      min-height: 0;
      overflow: auto;
      display: grid;
      gap: 10px;
      padding-right: 2px;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .analysis-section {
      min-width: 0;
      padding: 12px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .analysis-section-title {
      margin: 0 0 10px;
      color: #17202b;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 950;
    }

    .analysis-letter-list {
      display: grid;
      gap: 8px;
    }

    .analysis-letter-row {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) 34px;
      align-items: center;
      gap: 8px;
      min-height: 28px;
    }

    .analysis-letter-name {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      min-width: 0;
      color: #17202b;
      font-size: 14px;
      line-height: 1;
      font-weight: 950;
    }

    .analysis-letter-name small {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
    }

    .analysis-bar-track {
      height: 8px;
      min-width: 0;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(31, 122, 140, 0.1);
    }

    .analysis-bar-fill {
      display: block;
      height: 100%;
      min-width: 5px;
      border-radius: inherit;
      background: #1f7a8c;
    }

    .analysis-letter-count {
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
      font-weight: 950;
      text-align: right;
    }

    .analysis-table-wrap {
      max-height: 280px;
      overflow: auto;
      border-radius: 14px;
      box-shadow: inset 0 0 0 1px var(--line);
      -webkit-overflow-scrolling: touch;
    }

    .analysis-table {
      min-width: 440px;
    }

    .analysis-table .record-char {
      font-size: 18px;
    }

    .analysis-code {
      font-weight: 950;
      letter-spacing: 0;
    }

    .dictionary-panel {
      z-index: 11;
    }

    .dictionary-sheet {
      max-height: min(84dvh, 720px);
      grid-template-rows: auto auto auto minmax(0, 1fr);
    }

    .dictionary-add-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .dictionary-add-input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 0 13px;
      border-radius: 16px;
      background: #ffffff;
      color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--line);
      font: inherit;
      font-size: 15px;
      line-height: 46px;
      font-weight: 850;
    }

    .dictionary-add-button,
    .dictionary-action-button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 13px;
      border-radius: 16px;
      background: #17202b;
      color: #ffffff;
      font-size: 13px;
      font-weight: 950;
      box-shadow: 0 10px 20px rgba(16, 23, 31, 0.14);
      transition: transform 150ms ease, background 150ms ease;
    }

    .dictionary-add-button:active,
    .dictionary-action-button:active {
      transform: scale(0.98) translateY(1px);
      background: #222d39;
    }

    .dictionary-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));

      border-top: 1px solid rgba(21, 32, 43, 0.08);
      box-shadow: 0 -14px 32px rgba(25, 40, 55, 0.08);
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
    }

    .key-hint {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: calc(100% + 10px);
      width: auto;
      max-width: calc(100% - 34px);
      display: grid;
      justify-items: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px) scale(0.96);
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .key-hint.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    .key-hint-card {
      display: block;
      margin: 0 auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .key-hint-fallback {
      padding: 14px;
      border-radius: 14px;
      background: rgba(23, 32, 43, 0.96);
      color: #ffffff;
      box-shadow: 0 16px 34px rgba(16, 23, 31, 0.22);
      font-size: 15px;
      line-height: 1.35;
      font-weight: 850;
      text-align: center;
    }

    .key-row {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 7px;
    }

    .key-row:last-child {
      margin-bottom: 0;
    }

    .key {
      flex: 0 0 min(31px, calc((100% - 45px) / 10));
      min-width: 0;
      height: 48px;
      display: grid;
      place-items: center;
      gap: 0;
      border-radius: 12px;
      color: var(--ink);
      background: var(--key);
      box-shadow:
        0 3px 0 var(--key-deep),
        0 8px 16px rgba(25, 40, 55, 0.13);
      transition: transform 92ms ease, box-shadow 92ms ease, background 120ms ease;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
    }

    .key:active,
    .key.active,
    .key.holding {
      transform: translateY(3px) scale(0.96);
      background: #f7fbff;
      box-shadow:
        0 0 0 var(--key-deep),
        0 4px 9px rgba(25, 40, 55, 0.12);
    }

    .key-letter {
      display: block;
      margin-top: 0;
      font-size: 21px;
      line-height: 1;
      font-weight: 950;
      pointer-events: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .key-root {
      display: none;
    }

    @keyframes wordIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pop {
      0% {
        transform: scale(1);
      }
      42% {
        transform: scale(1.18);
      }
      70% {
        transform: scale(0.96);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes shake {
      0%, 100% {
        transform: translateX(0);
      }
      15% {
        transform: translateX(-10px) rotate(-1.5deg);
      }
      30% {
        transform: translateX(9px) rotate(1.4deg);
      }
      45% {
        transform: translateX(-7px) rotate(-1.2deg);
      }
      60% {
        transform: translateX(6px) rotate(1deg);
      }
      75% {
        transform: translateX(-3px) rotate(-0.7deg);
      }
    }

    @media (max-width: 480px) {

    const COMMONS_FILE = "https://commons.wikimedia.org/wiki/Special:Redirect/file/";

    function createSequentialId(prefix, index) {
      return `${prefix}-${String(index).padStart(2, "0")}`;
    }

    const MAIN_ROOTS = [
      { id: "main-01", letter: "Q", text: "手" },
      { id: "main-02", letter: "W", text: "田" },
      { id: "main-03", letter: "E", text: "水" },
      { id: "main-04", letter: "R", text: "口" },
      { id: "main-05", letter: "T", text: "廿" },

      { id: "main-08", letter: "I", text: "戈" },
      { id: "main-09", letter: "O", text: "人" },
      { id: "main-10", letter: "P", text: "心" },
      { id: "main-11", letter: "A", text: "日" },
      { id: "main-12", letter: "S", text: "尸" },
      { id: "main-13", letter: "D", text: "木" },
      { id: "main-14", letter: "F", text: "火" },
      { id: "main-15", letter: "G", text: "土" },
      { id: "main-16", letter: "H", text: "竹" },
      { id: "main-17", letter: "J", text: "十" },
      { id: "main-18", letter: "K", text: "大" },
      { id: "main-19", letter: "L", text: "中" },
      { id: "main-20", letter: "Z", text: "重" },
      { id: "main-21", letter: "X", text: "難" },
      { id: "main-22", letter: "C", text: "金" },
      { id: "main-23", letter: "V", text: "女" },
      { id: "main-24", letter: "B", text: "月" },
      { id: "main-25", letter: "N", text: "弓" },
      { id: "main-26", letter: "M", text: "一" }
    ];

    const MAIN_ROOTS_BY_LETTER = Object.fromEntries(MAIN_ROOTS.map((item) => [item.letter, item]));

    function getMainRoot(letter) {
      return MAIN_ROOTS_BY_LETTER[letter] || null;
    }

    function rootText(letter) {
      return getMainRoot(letter)?.text || letter;
    }

    function rootDataId(letter) {
      return getMainRoot(letter)?.id || "";
    }

    function buildAuxiliaryCardInfo(seed) {
      let auxIndex = 0;

      return Object.fromEntries(
        Object.entries(seed).map(([letter, info]) => {
          const glyphs = (info.glyphs || "")
            .trim()
            .split(/\s+/)
            .filter(Boolean)
            .map((glyphCode) => ({
              id: createSequentialId("aux", ++auxIndex),
              text: glyphCode,
              glyphCode
            }));

          const notes = info.note
            ? [{
                id: createSequentialId("aux", ++auxIndex),
                text: info.note
              }]
            : [];

          return [
            letter,
            {
              ...info,
              rootId: rootDataId(letter),
              glyphs,
              notes
            }
          ];
        })
      );
    }

    const AUXILIARY_CARD_SEED = {
      Q: { root: "手", color: "red", glyphs: "q0 q1 q2 q3 q4 q9 q5 q6 q7 q8" },
      W: { root: "田", color: "red", glyphs: "w0 w1 w2 w3" },
      E: { root: "水", color: "orange", glyphs: "e0 e1 e3 e4 e5 e2 e7 e6 e8" },
      R: { root: "口", color: "orange", glyphs: "r0" },
      T: { root: "廿", color: "orange", glyphs: "t0 t1 t2 t3 t4 t5 t6 t7 t8 t9 t10 t11 t12 t15 t13 t16" },
      Y: { root: "卜", color: "green", glyphs: "y0 y1 y2 y3 y4 y5 y6 y7 y8 y11" },
      U: { root: "山", color: "green", glyphs: "u0 u1 u2 u5 u3 u4" },
      I: { root: "戈", color: "magenta", glyphs: "i0 i1 i4 i2 i3" },
      O: { root: "人", color: "magenta", glyphs: "o0 o2 o3 o4 o5 o6 o7 o8 o9 o10 o11 o12 o13 o14" },
      P: { root: "心", color: "magenta", glyphs: "p0 p1 p2 p3 p4 p5 p6 p7 p8 p9 p10 p11 p12 p13 p14 p15 p17 p16" },
      A: { root: "日", color: "red", glyphs: "a0 a1 a2 a3" },
      S: { root: "尸", color: "red", glyphs: "s0 s1 s2 s3 s4 s5 s6 s7 s8 s9 s10" },
      D: { root: "木", color: "orange", glyphs: "d0 d1 d2 d7 d3 d4 d5 d6" },
      F: { root: "火", color: "orange", glyphs: "f0 f1 f2 f3 f5 f7 f4 f6 f8 f9 f11" },
      G: { root: "土", color: "orange", glyphs: "g0 g1 g2 g3" },
      H: { root: "竹", color: "green", glyphs: "h0 h1 h2 h3 h4 h5 h6" },
      J: { root: "十", color: "green", glyphs: "j0 j1 j3 j2" },

    function buildAuxiliaryGlyphCodeIndex() {
      const index = {};
      Object.values(AUXILIARY_CARD_INFO).forEach((card) => {

            ? AUX_GLYPH_CODE_TO_DATA_ID[radical.glyphCode]
            : AUXILIARY_CARD_INFO[radical.noteLetter]?.notes?.[0]?.id;
          return [
            radical.semanticId,
            {

              id: id || "",
              letter: radical.semanticId.split("_")[0]
            }

        auxLabel: radical?.label || answerText || `${rootText(letter)}：${rootText(letter)}`,
        answerText: answerText || radical?.label || `${rootText(letter)}：${rootText(letter)}`,

    function normalizeDefaultDictionarySource(payload) {
      const rows = Array.isArray(payload)
        ? payload
        : Array.isArray(payload?.characters)
          ? payload.characters
          : Array.isArray(payload?.items)
            ? payload.items
            : [];
      const seen = new Set();

      return rows
        .map((item, index) => {
          const character = getFirstHanCharacter(extractDictionaryCharacter(item));
          const rank = Number(item?.rank ?? item?.frequencyRank ?? index + 1);
          const count = Number(item?.count ?? item?.frequency ?? item?.freq ?? 0);
          if (!character || seen.has(character)) return null;
          seen.add(character);
          return {
            rank: Number.isFinite(rank) ? rank : index + 1,
            count: Number.isFinite(count) ? count : 0,
            character
          };
        })
        .filter(Boolean)
        .sort((a, b) => dictionaryRankValue(a) - dictionaryRankValue(b));
    }

    function loadCachedDefaultDictionarySource() {
      const cached = safeJsonParse(storageGet(DEFAULT_DICTIONARY_CACHE_KEY), null);
      const rows = normalizeDefaultDictionarySource(cached);
      return rows.length >= 3500 ? rows.slice(0, 3500) : [];
    }

    function saveCachedDefaultDictionarySource(rows) {
      if (!Array.isArray(rows) || rows.length < 3500) return;
      storageSet(
        DEFAULT_DICTIONARY_CACHE_KEY,
        JSON.stringify({
          version: 1,
          cachedAt: Date.now(),
          characters: rows.slice(0, 3500)
        })
      );
    }

    async function fetchDefaultDictionarySource(options = {}) {
      const forceRefresh = options.forceRefresh === true;
      const url = forceRefresh
        ? `${DEFAULT_DICTIONARY_URL}?v=${Date.now()}`
        : DEFAULT_DICTIONARY_URL;
      const response = await fetch(url, { cache: forceRefresh ? "no-store" : "force-cache" });
      if (!response.ok) throw new Error(`${DEFAULT_DICTIONARY_URL} HTTP ${response.status}`);
      const rows = normalizeDefaultDictionarySource(await response.json());
      if (rows.length < 3500) throw new Error(`default dictionary has ${rows.length} rows`);
      return rows.slice(0, 3500);
    }

    async function loadBuiltInDictionarySource(forceRefresh = false) {
      if (!forceRefresh && builtInDictionarySource.length >= 3500) return builtInDictionarySource;

      builtInDictionaryLoadStatus = "loading";
      try {
        const rows = await fetchDefaultDictionarySource({ forceRefresh });
        builtInDictionarySource = rows;
        saveCachedDefaultDictionarySource(rows);
        builtInDictionaryLoadStatus = "ready";
        return builtInDictionarySource;
      } catch (firstError) {
        if (!forceRefresh) {
          try {
            const rows = await fetchDefaultDictionarySource({ forceRefresh: true });
            builtInDictionarySource = rows;
            saveCachedDefaultDictionarySource(rows);
            builtInDictionaryLoadStatus = "ready";
            return builtInDictionarySource;
          } catch (secondError) {
            console.warn("Default dictionary refresh retry failed", secondError);
          }
        }

        const cachedRows = loadCachedDefaultDictionarySource();
        if (cachedRows.length >= 3500) {
          builtInDictionarySource = cachedRows;
          builtInDictionaryLoadStatus = "cached";
          return builtInDictionarySource;
        }

        console.warn("Default dictionary load failed", firstError);
        builtInDictionarySource = normalizeDefaultDictionarySource(DEFAULT_DICTIONARY_FALLBACK);
        builtInDictionaryLoadStatus = "fallback";
        return builtInDictionarySource;
      }
    }

    function rebuildBuiltInDictionary() {
      const builtInSourceRows = builtInDictionarySource.map((item) => ({
        ...item,
        char: item.character
      }));
      BUILT_IN_SOURCE_BY_CHARACTER = Object.fromEntries(builtInSourceRows.map((item) => [item.char, item]));
      BUILT_IN_SOURCE_CHARS = builtInSourceRows.map((item) => item.char);

      BUILT_IN_DICTIONARY = builtInDictionarySource
        .map((item) => {
          const codeInfo = codeInfoForCharacter(item.character);
          if (!codeInfo) return null;
          return normalizeDictionaryEntry(item, codeInfo);
        })
        .filter(Boolean)
        .sort((a, b) => dictionaryRankValue(a) - dictionaryRankValue(b));
      BUILT_IN_DICTIONARY_BY_CHARACTER = Object.fromEntries(BUILT_IN_DICTIONARY.map((item) => [item.char, item]));
      BUILT_IN_DICTIONARY_CHARS = BUILT_IN_DICTIONARY.map((item) => item.char);
      return BUILT_IN_DICTIONARY;
    }

    async function ensureBuiltInDictionaryAvailability(forceRefresh = false) {
      if (!forceRefresh && BUILT_IN_SOURCE_CHARS.length >= 3500) return BUILT_IN_DICTIONARY;
      await loadBuiltInDictionarySource(forceRefresh);
      rebuildBuiltInDictionary();
      return BUILT_IN_DICTIONARY;

    function ensureExternalCodeIndex() {
      if (externalCodeIndexPromise) return externalCodeIndexPromise;
      externalCodeIndexStatus = "loading";
      externalCodeIndexPromise = Promise.all(
        CANGJIE_INDEX_SOURCES.map((source) =>
          fetch(source.url)
            .then((response) => {
              if (!response.ok) throw new Error(`${source.url} HTTP ${response.status}`);
              return response.json();
            })
            .then((payload) => ({ source, rows: payload.rows || [] }))
        )
      )
        .then((payloads) => {
          const externalIndex = {};
          payloads.forEach(({ source, rows }) => {
            rows.forEach((item) => {
              if (!item.character || externalIndex[item.character]) return;
              externalIndex[item.character] = { ...item, sourceLabel: source.label };
            });
          });
          externalCodeByCharacter = externalIndex;
          externalCodeIndexStatus = "ready";
          return externalIndex;
        })
        .catch((error) => {
          console.warn("Cangjie table load failed", error);
          externalCodeIndexStatus = "failed";
          return {};
        });
      return externalCodeIndexPromise;
    }

      const target = getFirstHanCharacter(char);

      const codeInfo = codeInfoForCharacter(target);
      if (codeInfo) {
        return {
          found: true,
          status: "code",
          character: target,
          code: codeInfo.code,
          head: codeInfo.head,
          tail: codeInfo.tail,
          source: codeInfo.sourceLabel || "本地碼表",
          confidenceLabel: "碼表",
          note: `${codeInfo.sourceLabel || "本地碼表"}`
        };
      }

      return {
        found: false,
        status: "missing",
        character: target,
        message: externalCodeIndexStatus === "failed"

      };
    }

    }

    function normalizeDictionarySourceType(source) {
      if (source === "custom") return "custom";
      if (source === "edited") return "edited";
      return "builtin";
    }

    function buildDictionaryPersistencePayload(state = dictionaryState) {
      const source = normalizeDictionarySourceType(state?.source);
      const characters = source === "builtin"
        ? [...BUILT_IN_SOURCE_CHARS]
        : normalizeDictionaryCharacters(state?.characters || []);
      return {
        version: 2,
        app: "sucheng-trainer",
        source,
        baseDictionary: source === "edited" ? "builtin" : source,
        savedAt: new Date().toISOString(),
        characters
      };
    }

    function dictionaryStateFromPayload(payload) {
      if (!payload || typeof payload !== "object") return null;
      const source = normalizeDictionarySourceType(payload.source);
      const characters = charactersFromDictionaryPayload(payload);
      if (source === "builtin" || !characters.length) return defaultDictionaryState();
      return { source, characters };
    }

    async function getDictionaryFileRoot() {
      if (!supportsDictionaryFileStorage()) return null;
      try {
        return await navigator.storage.getDirectory();
      } catch (error) {
        console.warn("Dictionary file root unavailable", error);
        return null;
      }
    }

    async function readPersistedDictionaryFileState() {
      const root = await getDictionaryFileRoot();
      if (!root) return null;

      try {
        const handle = await root.getFileHandle(CUSTOM_DICTIONARY_FILE_NAME);
        const file = await handle.getFile();
        const payload = safeJsonParse(await file.text(), null);
        return dictionaryStateFromPayload(payload);
      } catch (error) {
        if (error?.name !== "NotFoundError") {
          console.warn("Custom dictionary file read failed", error);
        }
        return null;
      }
    }

    async function writePersistedDictionaryFileState(payload) {
      const root = await getDictionaryFileRoot();
      if (!root) return false;

      try {
        const handle = await root.getFileHandle(CUSTOM_DICTIONARY_FILE_NAME, { create: true });
        const writable = await handle.createWritable();
        await writable.write(JSON.stringify(payload, null, 2));
        await writable.close();
        return true;
      } catch (error) {
        console.warn("Custom dictionary file write failed", error);
        return false;
      }
    }

    async function removePersistedDictionaryFileState() {
      const root = await getDictionaryFileRoot();
      if (!root) return false;

      try {
        await root.removeEntry(CUSTOM_DICTIONARY_FILE_NAME);
        return true;
      } catch (error) {
        if (error?.name !== "NotFoundError") {
          console.warn("Custom dictionary file removal failed", error);
        }
        return false;
      }
    }

    async function hydrateDictionaryState() {
      const fileState = await readPersistedDictionaryFileState();
      if (fileState) return fileState;
      return loadDictionaryState();
    }

    async function persistDictionaryState() {
      saveDictionaryState();

      if (dictionaryState.source === "builtin") {
        await removePersistedDictionaryFileState();
        return { storage: "builtin" };
      }

      const savedToFile = await writePersistedDictionaryFileState(buildDictionaryPersistencePayload(dictionaryState));
      return savedToFile
        ? { storage: "file" }
        : { storage: "local-storage" };
    }

    function loadSettings() {
      const saved = safeJsonParse(storageGet(SETTINGS_KEY), {});
      const orderMode = saved.orderMode === "random" ? "random" : "rank";
      return {
        dailyLimit: normalizeDailyLimit(saved.dailyLimit),
        orderMode
      };
    }

    function saveSettings() {
      storageSet(SETTINGS_KEY, JSON.stringify(settings));
    }

    function dictionaryRankValue(item) {
      const rank = Number(item?.rank);
      return Number.isFinite(rank) ? rank : Infinity;
    }

    function compareDictionaryEntries(a, b) {
      if (dictionaryState?.source === "custom") {
        return (a.customOrder || 0) - (b.customOrder || 0) || a.char.localeCompare(b.char, "zh-Hant");
      }

      const aRank = dictionaryRankValue(a);
      const bRank = dictionaryRankValue(b);
      if (aRank !== bRank) return aRank < bRank ? -1 : 1;
      return (a.customOrder || 0) - (b.customOrder || 0) || a.char.localeCompare(b.char, "zh-Hant");
    }

    function defaultDictionaryState() {
      return { source: "builtin", characters: null };
    }

    function loadDictionaryState() {
      const saved = safeJsonParse(storageGet(DICTIONARY_KEY), null);
      if (!saved || typeof saved !== "object") return defaultDictionaryState();

      const source = saved.source === "custom" ? "custom" : saved.source === "edited" ? "edited" : "builtin";
      const characters = normalizeDictionaryCharacters(saved.characters || saved.words || saved.items || []);

      if (source === "builtin" || !characters.length) return defaultDictionaryState();
      return { source, characters };
    }

    function saveDictionaryState() {
      if (dictionaryState.source === "builtin") {
        storageRemove(DICTIONARY_KEY);
        return;
      }

      storageSet(DICTIONARY_KEY, JSON.stringify({
        version: 1,
        source: dictionaryState.source,
        characters: currentDictionaryCharacters()
      }));
    }

    function extractDictionaryCharacter(item) {
      if (typeof item === "string") return item;
      if (!item || typeof item !== "object") return "";
      return item.char || item.character || item.text || item.word || "";
    }

    function normalizeDictionaryCharacters(value) {
      const source = typeof value === "string"
        ? Array.from(value)
        : Array.isArray(value)
          ? value.flatMap((item) => Array.from(String(extractDictionaryCharacter(item))))
          : [];
      const seen = new Set();
      return source
        .filter((char) => /\p{Script=Han}/u.test(char))
        .filter((char) => {
          if (seen.has(char)) return false;
          seen.add(char);
          return true;
        });
    }

    function charactersFromDictionaryPayload(payload) {
      if (Array.isArray(payload) || typeof payload === "string") return normalizeDictionaryCharacters(payload);
      if (!payload || typeof payload !== "object") return [];
      return normalizeDictionaryCharacters(payload.characters || payload.words || payload.items || payload.dictionary || "");
    }

    function currentDictionaryCharacters() {
      return dictionaryState.source === "builtin"
        ? [...BUILT_IN_SOURCE_CHARS]
        : [...(dictionaryState.characters || [])];
    }

    function customEntryFromCodeInfo(char, codeInfo, customOrder = 0, source = "edited") {
      return {
        character: char,
        char,
        head: codeInfo.head,
        tail: codeInfo.tail,
        code: codeInfo.code,
        customOrder,
        source,
        sourceLabel: codeInfo.sourceLabel || "自訂詞庫",
        answerText: {
          head: `${rootText(codeInfo.head)}：${rootText(codeInfo.head)}`,
          tail: `${rootText(codeInfo.tail)}：${rootText(codeInfo.tail)}`
        },
        decomposition: {
          source: "cangjie-code-index",
          confidence: "code",
          parts: [
            createDecompositionPart("head", codeInfo.head, "", ""),
            createDecompositionPart("tail", codeInfo.tail, "", "")
          ]
        }
      };
    }

    function customEntryFromBuiltIn(item, customOrder = 0) {
      const { rank, count, ...entry } = item;
      return {
        ...entry,
        customOrder,
        source: "custom"
      };
    }

    function dictionaryEntryForCharacter(char, customOrder = 0) {
      const builtIn = BUILT_IN_DICTIONARY_BY_CHARACTER[char];
      if (builtIn && dictionaryState.source !== "custom") return builtIn;
      if (builtIn && dictionaryState.source === "custom") return customEntryFromBuiltIn(builtIn, customOrder);

      const codeInfo = codeInfoForCharacter(char);
      if (!codeInfo) return null;
      return customEntryFromCodeInfo(char, codeInfo, customOrder, dictionaryState.source);
    }

    function rebuildActiveDictionary() {
      const characters = currentDictionaryCharacters();
      DICTIONARY = characters
        .map((char, customOrder) => dictionaryEntryForCharacter(char, customOrder))
        .filter(Boolean)
        .sort(compareDictionaryEntries);
      DICTIONARY_BY_CHARACTER = Object.fromEntries(DICTIONARY.map((item) => [item.char, item]));
      DICTIONARY_CHAR_SET = new Set(DICTIONARY.map((item) => item.char));
    }

    function useRandomDailyOrder() {
      return dictionaryState.source === "custom" || settings.orderMode === "random";
    }

    function normalizeDailyLimit(value) {
      const parsed = Number(value);
      if (!Number.isFinite(parsed)) return 10;
      return DAILY_LIMIT_OPTIONS.reduce((closest, option) => (
        Math.abs(option - parsed) < Math.abs(closest - parsed) ? option : closest
      ), DAILY_LIMIT_OPTIONS[0]);
    }

    function syncDailyLimitButtons() {
      dailyLimitButtons.forEach((button) => {
        const active = Number(button.dataset.dailyLimit) === settings.dailyLimit;
        button.classList.toggle("is-active", active);
        button.setAttribute("aria-pressed", active ? "true" : "false");
      });
    }

    function syncOrderModeButtons() {
      const random = settings.orderMode === "random";
      orderModeSwitch.classList.toggle("is-random", random);
      orderModeSwitch.setAttribute("aria-checked", random ? "true" : "false");
      orderModeSwitch.setAttribute("aria-label", random ? "目前隨機出字，點擊切換為字頻順序" : "目前字頻順序，點擊切換為隨機出字");
    }

    function loadProgress() {
      const saved = safeJsonParse(storageGet(STORAGE_KEY), null);
      if (!saved || typeof saved !== "object") {
        return { learned: {}, daily: {} };
      }

      const learned = saved.learned && typeof saved.learned === "object" ? saved.learned : {};
      Object.values(learned).forEach(normalizeMemory);

      return {
        learned,
        daily: saved.daily && typeof saved.daily === "object" ? saved.daily : {}
      };
    }

    function saveProgress() {
      storageSet(STORAGE_KEY, JSON.stringify(progress));
    }

    function defaultAnalysis() {
      return { version: 1, attempts: [] };
    }

    function normalizeAnalysisAttempt(item) {
      if (!item || typeof item !== "object") return null;
      const char = getFirstHanCharacter(item.char || item.character || item.target || "");
      const skipped = item.skipped === true || item.reason === "hint";
      const expected = {
        head: String(item.expected?.head || item.correct?.head || item.head || "").toUpperCase(),
        tail: String(item.expected?.tail || item.correct?.tail || item.tail || "").toUpperCase()
      };
      const actual = {
        head: String(item.actual?.head || item.input?.head || item.user?.head || "").toUpperCase(),
        tail: String(item.actual?.tail || item.input?.tail || item.user?.tail || "").toUpperCase()
      };
      if (!char || !expected.head || !expected.tail) return null;
      if ((!actual.head || !actual.tail) && !skipped) return null;

      return {
        time: Number(item.time || item.timestamp || Date.now()),
        char,
        expected,
        actual,
        skipped,
        errorType: skipped ? "all" : classifyAnalysisAttempt(expected, actual)
      };
    }

    function loadAnalysis() {
      const saved = safeJsonParse(storageGet(ANALYTICS_KEY), null);
      const attemptsSource = Array.isArray(saved)
        ? saved
        : Array.isArray(saved?.attempts)
          ? saved.attempts
          : [];
      return {
        version: 1,
        attempts: attemptsSource.map(normalizeAnalysisAttempt).filter(Boolean)
      };
    }

    function saveAnalysis() {
      storageSet(ANALYTICS_KEY, JSON.stringify({
        version: 1,
        attempts: analysisState.attempts
      }));
    }

    function classifyAnalysisAttempt(expected, actual) {
      const headWrong = actual.head !== expected.head;
      const tailWrong = actual.tail !== expected.tail;
      if (!headWrong && !tailWrong) return "correct";
      if (headWrong && !tailWrong) return "head";
      if (!headWrong && tailWrong) return "tail";
      return "all";
    }

    function recordInputAnalysis(question, actualLetters) {
      if (!question || !Array.isArray(actualLetters) || actualLetters.length < 2) return;
      const expected = { head: question.head, tail: question.tail };
      const actual = {
        head: String(actualLetters[0] || "").toUpperCase(),
        tail: String(actualLetters[1] || "").toUpperCase()
      };
      const attempt = normalizeAnalysisAttempt({
        time: Date.now(),
        char: question.char,
        expected,
        actual
      });
      if (!attempt) return;

      analysisState.attempts.push(attempt);
      saveAnalysis();
      if (analysisPanel.classList.contains("show")) renderAnalysisPanel();
    }

    function recordSkippedAnalysis(question) {
      if (!question) return;
      const attempt = normalizeAnalysisAttempt({
        time: Date.now(),
        char: question.char,
        expected: { head: question.head, tail: question.tail },
        actual: { head: "", tail: "" },
        skipped: true
      });
      if (!attempt) return;

      analysisState.attempts.push(attempt);
      saveAnalysis();
      if (analysisPanel.classList.contains("show")) renderAnalysisPanel();
    }

    function analysisAttempts() {
      return analysisState.attempts.map(normalizeAnalysisAttempt).filter(Boolean);
    }

    function formatCodePair(pair) {
      if (!pair) return "";
      return `${rootText(pair.head)} ${rootText(pair.tail)}`;
    }

    function topLetterErrors(attempts) {
      const counts = {};
      attempts.forEach((attempt) => {
        if (attempt.errorType === "correct") return;
        if (attempt.actual.head !== attempt.expected.head && getMainRoot(attempt.expected.head)) {
          counts[attempt.expected.head] = (counts[attempt.expected.head] || 0) + 1;
        }
        if (attempt.actual.tail !== attempt.expected.tail && getMainRoot(attempt.expected.tail)) {
          counts[attempt.expected.tail] = (counts[attempt.expected.tail] || 0) + 1;
        }
      });

      return Object.entries(counts)
        .map(([letter, count]) => ({ letter, count }))
        .sort((a, b) => b.count - a.count || rootText(a.letter).localeCompare(rootText(b.letter), "zh-Hant"))
        .slice(0, 5);
    }

    function topMistakenWords(attempts) {
      const rows = new Map();
      attempts.forEach((attempt) => {
        if (attempt.errorType === "correct") return;
        if (!rows.has(attempt.char)) {
          rows.set(attempt.char, {
            char: attempt.char,
            expected: attempt.expected,
            wrong: 0,
            types: { head: 0, tail: 0, all: 0 }
          });
        }
        const row = rows.get(attempt.char);
        row.wrong += 1;
        row.types[attempt.errorType] = (row.types[attempt.errorType] || 0) + 1;
      });

      return [...rows.values()]
        .sort((a, b) => b.wrong - a.wrong || a.char.localeCompare(b.char, "zh-Hant"))
        .slice(0, 10);
    }

    function primaryMistakeType(types) {
      const entries = Object.entries(types || {}).sort((a, b) => b[1] - a[1]);
      const [type, count] = entries[0] || ["", 0];
      return count > 0 ? ANALYTICS_PRIMARY_LABELS[type] || ANALYTICS_ERROR_LABELS[type] || "錯誤" : "—";
    }

    function defaultMemory() {
      return {
        seen: 0,
        correct: 0,
        wrong: 0,
        streak: 0,
        level: 0,
        nextReview: 0,
        lastSeen: 0,
        learningStreak: 0,
        graduated: false
      };
    }

    function normalizeMemory(memory) {
      if (!memory || typeof memory !== "object") return memory;
      if (typeof memory.graduated !== "boolean") {
        memory.graduated = (memory.streak || 0) >= LEARNING_STEPS_CORRECT_NEEDED
          && Number.isFinite(memory.nextReview)
          && memory.nextReview > 0;
      }
      if (!Number.isFinite(memory.learningStreak)) {
        memory.learningStreak = memory.graduated
          ? 0
          : Math.min(Math.max(memory.streak || 0, 0), LEARNING_STEPS_CORRECT_NEEDED - 1);
      }
      return memory;
    }

    function isGraduatedMemory(memory) {
      return !!(memory && memory.graduated === true);
    }

    function isDueReviewMemory(memory, now = Date.now()) {
      return isGraduatedMemory(memory)
        && Number.isFinite(memory.nextReview)
        && memory.nextReview <= now;
    }

    function memoryFor(char) {
      if (!progress.learned[char]) progress.learned[char] = defaultMemory();
      normalizeMemory(progress.learned[char]);
      return progress.learned[char];
    }

    function dailyRecord() {
      const key = todayKey();
      if (!progress.daily[key]) progress.daily[key] = { introduced: [], practiceCount: 0, bonusLimit: 0, completed: false };
      if (!Array.isArray(progress.daily[key].introduced)) {
        progress.daily[key].introduced = [];
      }
      const seenChars = new Set();
      progress.daily[key].introduced = progress.daily[key].introduced.filter((char) => {
        const memory = progress.learned[char];
        const keepCompletedHistory = !DICTIONARY_CHAR_SET.has(char) && isGraduatedMemory(memory);
        if ((!DICTIONARY_CHAR_SET.has(char) && !keepCompletedHistory) || seenChars.has(char)) return false;
        seenChars.add(char);
        return true;
      });
      if (!Number.isFinite(progress.daily[key].practiceCount)) {
        progress.daily[key].practiceCount = 0;
      }
      if (!Number.isFinite(progress.daily[key].bonusLimit)) {
        progress.daily[key].bonusLimit = 0;
      }
      if (typeof progress.daily[key].completed !== "boolean") {
        progress.daily[key].completed = false;
      }
      return progress.daily[key];
    }

    function resetTodayQueueForDictionaryChange() {
      const today = dailyRecord();
      today.introduced = [];
      today.bonusLimit = 0;
      today.completed = false;
      saveProgress();
    }

    function resetUnseenTodayQueueForOrderChange() {
      const today = dailyRecord();
      today.introduced = today.introduced.filter((char) => {
        const memory = progress.learned[char];
        return memory && memory.seen > 0;
      });
      today.completed = false;
      saveProgress();
    }

    function trimTodayIntroducedToLimit() {
      const today = dailyRecord();
      if (today.introduced.length <= settings.dailyLimit) return;

      const keep = [];
      const removable = [];
      today.introduced.forEach((char) => {
        const memory = progress.learned[char];
        if (isGraduatedMemory(memory)) {
          keep.push(char);
        } else {
          removable.push(char);
        }
      });

      today.introduced = [...keep, ...removable].slice(0, Math.max(settings.dailyLimit, keep.length));
      saveProgress();
    }

    function reviewPriority(a, b, now = Date.now()) {
      const aMemory = a.memory;
      const bMemory = b.memory;
      const aDue = isDueReviewMemory(aMemory, now) ? 1 : 0;
      const bDue = isDueReviewMemory(bMemory, now) ? 1 : 0;
      if (aDue !== bDue) return bDue - aDue;

      const levelDiff = (aMemory.level || 0) - (bMemory.level || 0);
      if (levelDiff) return levelDiff;

      const aWrongRate = (aMemory.wrong || 0) / Math.max(1, aMemory.seen || 0);
      const bWrongRate = (bMemory.wrong || 0) / Math.max(1, bMemory.seen || 0);
      if (aWrongRate !== bWrongRate) return bWrongRate - aWrongRate;

      const wrongDiff = (bMemory.wrong || 0) - (aMemory.wrong || 0);
      if (wrongDiff) return wrongDiff;

      return (aMemory.nextReview || 0) - (bMemory.nextReview || 0) || compareDictionaryEntries(a.item, b.item);
    }

    function interleaveNewItems(reviewItems, newItems) {
      const result = [];
      const newQueue = [...newItems];

      reviewItems.forEach((itemIndex, position) => {
        result.push(itemIndex);
        if ((position + 1) % 2 === 0 && newQueue.length) {
          result.push(newQueue.shift());
        }
      });

      return [...result, ...newQueue];
    }

    function shuffleIndexes(indexes) {
      const shuffled = [...indexes];
      for (let i = shuffled.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function insertLearningCard(card) {
      const index = learningQueue.length === 0
        ? learningQueue.length
        : Math.floor(Math.random() * (learningQueue.length + 1));
      learningQueue.splice(index, 0, card);
    }

    function takeLearningCard(avoidItemIndex = -1) {
      if (!learningQueue.length) return null;
      let queueIndex = Math.floor(Math.random() * learningQueue.length);

      if (learningQueue.length > 1) {
        const alternatives = learningQueue
          .map((card, index) => ({ card, index }))
          .filter(({ card }) => card.itemIndex !== avoidItemIndex);
        if (alternatives.length) {
          queueIndex = alternatives[Math.floor(Math.random() * alternatives.length)].index;
        }
      }

      return learningQueue.splice(queueIndex, 1)[0] || null;
    }

    function newWordCandidateIndexes() {
      const indexes = DICTIONARY
        .map((item, itemIndex) => ({ item, itemIndex, memory: progress.learned[item.char] }))
        .filter(({ memory }) => !memory || memory.seen <= 0)
        .map(({ itemIndex }) => itemIndex);

      return useRandomDailyOrder()
        ? shuffleIndexes(indexes)
        : indexes.sort((a, b) => compareDictionaryEntries(DICTIONARY[a], DICTIONARY[b]));
    }

    function dueReviewIndexes(now = Date.now()) {
      return DICTIONARY
        .map((item, itemIndex) => ({ item, itemIndex, memory: progress.learned[item.char] }))
        .filter(({ memory }) => isDueReviewMemory(memory, now))
        .sort((a, b) => reviewPriority(a, b, now))
        .map(({ itemIndex }) => itemIndex);
    }

    function introduceNewWords(today) {
      if (today.completed) return;
      const introduced = new Set(today.introduced);
      const remainingNewSlots = Math.max(0, todayNewLimit(today) - introduced.size);
      if (remainingNewSlots <= 0) return;

      for (const itemIndex of newWordCandidateIndexes()) {
        if (today.introduced.length >= todayNewLimit(today)) break;
        const item = DICTIONARY[itemIndex];
        if (!item || introduced.has(item.char)) continue;
        introduced.add(item.char);
        today.introduced.push(item.char);
      }
    }

    function pendingNewIndexes(today) {
      return today.introduced
        .map((char) => DICTIONARY.findIndex((item) => item.char === char))
        .filter((itemIndex) => {
          if (itemIndex < 0) return false;
          const memory = progress.learned[DICTIONARY[itemIndex].char];
          return !isGraduatedMemory(memory);
        });
    }

    function ungraduatedPracticeIndexes(today = dailyRecord()) {
      const introduced = new Set(today.introduced);
      return DICTIONARY
        .map((item, itemIndex) => ({ item, itemIndex, memory: progress.learned[item.char] }))
        .filter(({ item, memory }) => {
          return memory && memory.seen > 0 && !isGraduatedMemory(memory) && !introduced.has(item.char);
        })
        .map(({ itemIndex }) => itemIndex);
    }

    function uniqueIndexes(indexes) {
      return [...new Set(indexes.filter((itemIndex) => Number.isInteger(itemIndex) && itemIndex >= 0))];
    }

    function createQuestionOrder() {
      const requestedChar = new URLSearchParams(window.location.search).get("char");
      const requestedIndex = DICTIONARY.findIndex((item) => item.char === requestedChar);

      const now = Date.now();
      const today = dailyRecord();
      introduceNewWords(today);

      const reviewOrder = shuffleIndexes(dueReviewIndexes(now));
      const pendingOrder = shuffleIndexes(pendingNewIndexes(today));
      const practiceOrder = shuffleIndexes(ungraduatedPracticeIndexes(today));
      const uniqueOrder = uniqueIndexes(interleaveNewItems(reviewOrder, [...pendingOrder, ...practiceOrder]));

      if (requestedIndex !== -1) {
        return [requestedIndex, ...uniqueOrder.filter((itemIndex) => itemIndex !== requestedIndex)];
      }

      today.completed = isDailyTaskComplete(today, now);
      saveProgress();
      return uniqueOrder;
    }

    function currentQuestion() {
      if (currentLearningCard !== null) {
        return DICTIONARY[currentLearningCard.itemIndex] || null;
      }
      return Number.isInteger(order[index]) ? DICTIONARY[order[index]] : null;
    }

    function isLearningCard() {
      return currentLearningCard !== null;
    }

    // Decide the next card to show: learning queue or advance index
    function pickNextCard() {
      currentLearningCard = null;

      // Time to show a learning card?
      if (learningQueue.length > 0) {
        if (learningInsertCountdown <= 0) {
          currentLearningCard = takeLearningCard(lastShownItemIndex);
          learningInsertCountdown = LEARNING_REINSERT_AFTER;
          return;
        }
        learningInsertCountdown -= 1;
      }

      // Otherwise advance the main order
      index += 1;
    }

    function countDueReviews(now = Date.now()) {
      return DICTIONARY.reduce((count, item) => {
        const memory = progress.learned[item.char];
        return count + (isDueReviewMemory(memory, now) ? 1 : 0);
      }, 0);
    }

    function nextDueReviewTime(now = Date.now()) {
      return DICTIONARY.reduce((soonest, item) => {
        const memory = progress.learned[item.char];
        if (!isGraduatedMemory(memory) || !Number.isFinite(memory.nextReview) || memory.nextReview <= now) {
          return soonest;
        }
        return Math.min(soonest, memory.nextReview);
      }, Infinity);
    }

    function todayDisplayText() {
      const date = new Date();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${month}/${day}`;
    }

    function todayNewLimit(today = dailyRecord()) {
      return settings.dailyLimit + (today.bonusLimit || 0);
    }

    function todayIntroducedLearnedCount(today = dailyRecord()) {
      return today.introduced.reduce((count, char) => {
        const memory = progress.learned[char];
        return count + (isGraduatedMemory(memory) ? 1 : 0);
      }, 0);
    }

    function todayIntroducedPendingCount(today = dailyRecord()) {
      return today.introduced.reduce((count, char) => {
        const memory = progress.learned[char];
        return count + (isGraduatedMemory(memory) ? 0 : 1);
      }, 0);
    }

    function graduatedWordCount() {
      return Object.values(progress.learned).reduce((count, memory) => {
        return count + (isGraduatedMemory(memory) ? 1 : 0);
      }, 0);
    }

    function remainingUnseenWordCount(today = dailyRecord()) {
      const introduced = new Set(today.introduced);
      return DICTIONARY.reduce((count, item) => {
        const memory = progress.learned[item.char];
        if ((memory && memory.seen > 0) || introduced.has(item.char)) return count;
        return count + 1;
      }, 0);
    }

    function isDailyTaskComplete(today = dailyRecord(), now = Date.now()) {
      return !hasDueReviewNow(now)
        && ungraduatedPracticeIndexes(today).length === 0
        && todayIntroducedPendingCount(today) === 0
        && todayIntroducedLearnedCount(today) >= todayNewLimit(today);
    }

    function canLearnMoreToday(today = dailyRecord()) {
      const base = settings.dailyLimit;
      const maxBonus = Math.max(3, Math.ceil(base * 0.5));
      return isDailyTaskComplete(today)
        && remainingUnseenWordCount(today) > 0
        && (today.bonusLimit || 0) < maxBonus;
    }

    function learnMoreAmount(today = dailyRecord()) {
      const base = settings.dailyLimit;
      const maxBonus = Math.max(3, Math.ceil(base * 0.5));
      const currentBonus = today.bonusLimit || 0;
      const remainingNewWords = remainingUnseenWordCount(today);
      return Math.min(Math.max(0, maxBonus - currentBonus), remainingNewWords);
    }

    function updateCompletedActionButton(today = dailyRecord()) {
      const canLearnMore = canLearnMoreToday(today);
      hintButton.disabled = !canLearnMore;
      hintButton.textContent = canLearnMore ? "學更多新字" : "已完成今日任務";
      hintButton.classList.remove("next");
      hintButton.dataset.action = canLearnMore ? "learn-more" : "complete";
    }

    function updateMemoryText() {
      const today = dailyRecord();
      const learnedCount = graduatedWordCount();
      const dueCount = countDueReviews();
      const learnedToday = todayIntroducedLearnedCount(today);
      const completed = isDailyTaskComplete(today);

      if (studyNewStat) {
        studyNewStat.textContent = completed ? "完成" : `${learnedToday}/${todayNewLimit(today)}`;
      }
      if (studyReviewStat) {
        studyReviewStat.textContent = dueCount > 0 ? String(dueCount) : "0";
      }
      if (studyLearnedStat) {
        studyLearnedStat.textContent = String(learnedCount);
      }

      memoryText.setAttribute(
        "aria-label",
        completed
          ? `已完成今日任務，待複習 ${dueCount}，總已學 ${learnedCount}`
          : `今日新字 ${learnedToday}/${todayNewLimit(today)}，待複習 ${dueCount}，總已學 ${learnedCount}`
      );
      studyStrip.classList.toggle("is-complete", completed);
      today.completed = completed;
    }

    function hasDueReviewNow(now = Date.now()) {
      return DICTIONARY.some((item) => {
        const memory = progress.learned[item.char];
        return isDueReviewMemory(memory, now);
      });
    }

    function formatDateTime(time) {
      if (!time) return "未排程";
      const date = new Date(time);
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      const hour = String(date.getHours()).padStart(2, "0");
      const minute = String(date.getMinutes()).padStart(2, "0");
      return `${month}/${day} ${hour}:${minute}`;
    }

    function percent(value) {
      return `${Math.round(value * 100)}%`;
    }

    function accuracyValue(memory) {
      return (memory.correct || 0) / Math.max(1, (memory.correct || 0) + (memory.wrong || 0));
    }

    function recordSortValue(row, key) {
      const memory = row.memory;
      if (key === "seen") return memory.seen || 0;
      if (key === "accuracy") return accuracyValue(memory);
      if (key === "streak") return memory.streak || 0;
      if (key === "nextReview") return memory.nextReview || 0;
      return 0;
    }

    function defaultLearningRowCompare(a, b) {
      const wrongDiff = (b.memory.wrong || 0) - (a.memory.wrong || 0);
      if (wrongDiff) return wrongDiff;
      return (b.memory.lastSeen || 0) - (a.memory.lastSeen || 0) || compareDictionaryEntries(a.item, b.item);
    }

    function compareLearningRows(a, b) {
      if (recordSort.key === "default") return defaultLearningRowCompare(a, b);

      const direction = recordSort.direction === "asc" ? 1 : -1;
      const diff = recordSortValue(a, recordSort.key) - recordSortValue(b, recordSort.key);
      if (diff) return diff * direction;
      return defaultLearningRowCompare(a, b);
    }

    function sortControl(key, label) {
      const active = recordSort.key === key;
      const direction = active ? recordSort.direction : "desc";
      const orderText = direction === "asc" ? "順序" : "倒序";
      return `
        <span class="record-sort-head">
          <span>${label}</span>
          <button
            class="record-sort-button"
            type="button"
            data-sort-key="${key}"
            data-direction="${direction}"
            aria-pressed="${active ? "true" : "false"}"
            aria-label="${label}${active ? `目前${orderText}` : "排序"}"
            title="${label}${active ? `：${orderText}` : "排序"}"
          ></button>
        </span>
      `;
    }

    function learningRows() {
      return DICTIONARY
        .map((item) => ({ item, memory: progress.learned[item.char] }))
        .filter(({ memory }) => memory && memory.seen > 0)
        .sort(compareLearningRows);
    }

    function renderRecordPanel() {
      const rows = learningRows();
      const graduatedCount = rows.filter((row) => isGraduatedMemory(row.memory)).length;
      const totalSeen = rows.reduce((sum, row) => sum + (row.memory.seen || 0), 0);
      const totalCorrect = rows.reduce((sum, row) => sum + (row.memory.correct || 0), 0);
      const totalWrong = rows.reduce((sum, row) => sum + (row.memory.wrong || 0), 0);
      const dueCount = countDueReviews();

      const today = dailyRecord();
      recordSubtitle.textContent = `已學 ${graduatedCount} 個單字 · 今日新字 ${todayIntroducedLearnedCount(today)}/${todayNewLimit(today)}`;
      recordSummary.innerHTML = `
        <div class="record-stat"><strong>${graduatedCount}</strong><span>已學單字</span></div>
        <div class="record-stat"><strong>${totalSeen}</strong><span>練習次數</span></div>
        <div class="record-stat"><strong>${percent(totalCorrect / Math.max(1, totalCorrect + totalWrong))}</strong><span>總正確率</span></div>
        <div class="record-stat"><strong>${dueCount}</strong><span>待複習</span></div>
      `;

      if (!rows.length) {
        recordTableWrap.innerHTML = `<div class="record-empty">完成一次練習後，這裡會顯示每個單字的學習次數、正確次數、錯誤次數和下次複習時間。</div>`;
        return;
      }

      const body = rows.map(({ item, memory }) => {
        const attempts = memory.seen || 0;
        const correct = memory.correct || 0;
        const wrong = memory.wrong || 0;
        const rate = percent(accuracyValue(memory));
        const rankText = Number.isFinite(Number(item.rank)) ? `#${item.rank}` : "自訂";
        return `
          <tr>
            <td><span class="record-char">${item.char}</span></td>
            <td>${rankText}</td>
            <td>${item.head}${item.tail}</td>
            <td>${attempts}</td>
            <td>${correct}</td>
            <td>${wrong}</td>
            <td>${rate}</td>
            <td>${memory.streak || 0}</td>
            <td>${formatDateTime(memory.nextReview)}</td>
          </tr>
        `;
      }).join("");

      recordTableWrap.innerHTML = `
        <table class="record-table">
          <thead>
            <tr>
              <th>單字</th>
              <th>Rank</th>
              <th>碼</th>
              <th>${sortControl("seen", "次數")}</th>
              <th>正確</th>
              <th>錯誤</th>
              <th>${sortControl("accuracy", "正確率")}</th>
              <th>${sortControl("streak", "連勝")}</th>
              <th>${sortControl("nextReview", "下次複習")}</th>
            </tr>
          </thead>
          <tbody>${body}</tbody>
        </table>
      `;
    }

    function renderAnalysisPanel() {
      const attempts = analysisAttempts();
      const wrongAttempts = attempts.filter((attempt) => attempt.errorType !== "correct");
      const correctCount = attempts.length - wrongAttempts.length;
      const accuracy = attempts.length ? percent(correctCount / attempts.length) : "0%";
      const letters = topLetterErrors(attempts);
      const words = topMistakenWords(attempts);

      analysisSubtitle.textContent = attempts.length
        ? `已記錄 ${attempts.length} 次輸入 · 整體正確率 ${accuracy}`
        : "尚未記錄輸入軌跡";
      analysisOverview.innerHTML = `
        <div class="record-stat"><strong>${attempts.length}</strong><span>總輸入次數</span></div>
        <div class="record-stat"><strong>${accuracy}</strong><span>整體正確率</span></div>
      `;

      if (!letters.length) {
        analysisLetterList.innerHTML = `<div class="record-empty">完成幾次兩碼輸入後，這裡會顯示最常被拆錯的正確字母。</div>`;
      } else {
        const maxLetterCount = Math.max(...letters.map((item) => item.count), 1);
        analysisLetterList.innerHTML = letters.map(({ letter, count }) => {
          const width = Math.max(8, Math.round((count / maxLetterCount) * 100));
          return `
            <div class="analysis-letter-row">
              <span class="analysis-letter-name">${escapeHtml(rootText(letter))}<small>${escapeHtml(letter)}</small></span>
              <span class="analysis-bar-track" aria-hidden="true">
                <span class="analysis-bar-fill" style="width: ${width}%"></span>
              </span>
              <span class="analysis-letter-count">${count}</span>
            </div>
          `;
        }).join("");
      }

      if (!words.length) {
        analysisWordTableWrap.innerHTML = `<div class="record-empty">目前沒有錯誤輸入紀錄。</div>`;
        return;
      }

      const body = words.map((row) => `
        <tr>
          <td><span class="record-char">${escapeHtml(row.char)}</span></td>
          <td><span class="analysis-code">${escapeHtml(formatCodePair(row.expected))}</span></td>
          <td>${row.wrong}</td>
          <td>${escapeHtml(primaryMistakeType(row.types))}</td>
        </tr>
      `).join("");

      analysisWordTableWrap.innerHTML = `
        <table class="record-table analysis-table">
          <thead>
            <tr>
              <th>中文字</th>
              <th>正確編碼</th>
              <th>錯誤次數</th>
              <th>主要錯誤類型</th>
            </tr>
          </thead>
          <tbody>${body}</tbody>
        </table>
      `;
    }

        closeDictionaryPanel();

      recordPanel.setAttribute("aria-hidden", open ? "false" : "true");
