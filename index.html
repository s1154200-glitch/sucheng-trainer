    }

    function dictionaryModeLabel() {
      if (dictionaryState.source === "custom") return "自訂 JSON 詞庫 · 使用獨立 JSON";
      if (dictionaryState.source === "edited") return "已編輯內建詞庫 · 使用獨立 JSON";
      return "內建中大 3500 字頻詞庫";
    }

    function setDictionaryStatus(message = "") {
      dictionaryStatus.textContent = message;
    }

    function formatDictionaryRank(item) {
      const rank = Number(item?.rank);
      if (Number.isFinite(rank) && rank > 0) return `#${rank}`;
      return dictionaryState.source === "custom" ? "自訂" : "新增";
    }

    function renderDictionaryEditor() {
      const characters = currentDictionaryCharacters();
      dictionarySubtitle.textContent = dictionaryModeLabel();
      if (dictionarySourceHint) {
        dictionarySourceHint.hidden = dictionaryState.source !== "builtin";
      }
      dictionaryCountLabel.textContent = characters.length === DICTIONARY.length
        ? `${characters.length} 個字`
        : `${characters.length} 個字 · ${DICTIONARY.length} 可練習`;

      if (!characters.length) {
        dictionaryList.innerHTML = `<div class="record-empty">詞庫目前沒有可練習的字。請添加漢字，或輸入 JSON 詞庫。</div>`;
        return;
      }

      const rows = characters
        .map((char, customOrder) => ({
          char,
          customOrder,
          item: DICTIONARY_BY_CHARACTER[char] || BUILT_IN_SOURCE_BY_CHARACTER[char] || null
        }))
        .sort((a, b) => {
          if (dictionaryState.source === "custom") return a.customOrder - b.customOrder;
          if (a.item && b.item) return compareDictionaryEntries(a.item, b.item);
          if (a.item || b.item) return a.item ? -1 : 1;
          return a.customOrder - b.customOrder;
        });

      const body = rows.map(({ char, item }) => {
        const rankText = formatDictionaryRank(item);
        const rankClass = item && Number.isFinite(Number(item.rank)) ? "dictionary-frequency-cell" : "dictionary-frequency-cell is-empty";
        return `
          <tr>
            <td><span class="record-char">${escapeHtml(char)}</span></td>
            <td class="${rankClass}">${escapeHtml(rankText)}</td>
            <td>
              <button class="dictionary-delete-button" type="button" data-char="${escapeHtml(char)}" aria-label="剷除 ${escapeHtml(char)}">剷除</button>
            </td>
          </tr>
        `;
      }).join("");

      dictionaryList.innerHTML = `
        <table class="record-table dictionary-table">
          <thead>
            <tr>
              <th>單字</th>
              <th>Rank</th>
              <th></th>
            </tr>
          </thead>
          <tbody>${body}</tbody>
        </table>
      `;

      if (characters.length !== DICTIONARY.length) {
        setDictionaryStatus(`有 ${characters.length - DICTIONARY.length} 個字暫時沒有碼表資料，未加入練習。`);
      } else if (!dictionaryStatus.textContent) {
        setDictionaryStatus("");
      }
    }

    function refreshDictionaryFromLoadedCodeIndex() {
      const before = DICTIONARY.length;
      rebuildBuiltInDictionary();
      rebuildActiveDictionary();
      if (DICTIONARY.length !== before) {
        saveDictionaryState();
        if (dictionaryPanel.classList.contains("show")) {
          setDictionaryStatus(`完整碼表已載入，詞庫已更新為 ${DICTIONARY.length} 個可練習字。`);
          renderDictionaryEditor();
        }
        rebuildSession();
      }
    }

    function setDictionaryPanel(open) {
      if (open) {
        closeSettingsMenu();
        closeRecordPanel();
        closeAnalysisPanel();
        setDictionaryStatus("");
      }

      dictionaryPanel.classList.toggle("show", open);
      dictionaryPanel.setAttribute("aria-hidden", open ? "false" : "true");
      if (open) {
        if (dictionaryState.source === "builtin" && BUILT_IN_SOURCE_CHARS.length < 3500) {
          dictionaryCountLabel.textContent = `${BUILT_IN_SOURCE_CHARS.length || 0} 個字`;
          dictionaryList.innerHTML = `<div class="record-empty">正在載入內建 3500 字頻詞庫...</div>`;
          setDictionaryStatus("正在同步內建詞庫...");
          ensureBuiltInDictionaryAvailability(true)
            .then(() => {
              if (!dictionaryPanel.classList.contains("show")) return;
              setDictionaryStatus("");
              renderDictionaryEditor();
            })
            .catch((error) => {
              console.warn("Dictionary panel refresh failed", error);
              if (!dictionaryPanel.classList.contains("show")) return;
              renderDictionaryEditor();
            });
          return;
        }
        renderDictionaryEditor();
      }
    }

    function closeDictionaryPanel() {
      setDictionaryPanel(false);
    }

    async function applyDictionaryChange(nextState, statusMessage = "", options = {}) {
      dictionaryState = nextState;
      if (dictionaryState.source !== "builtin" && externalCodeIndexStatus !== "ready" && externalCodeIndexStatus !== "failed") {
        setDictionaryStatus("正在載入完整碼表...");
        await ensureExternalCodeIndex();
      }
      rebuildActiveDictionary();
      if (options.resetToday) resetTodayQueueForDictionaryChange();
      const persistence = await persistDictionaryState();
      const persistenceNote = dictionaryState.source === "builtin"
        ? ""
        : persistence.storage === "file"
          ? " 已同步到獨立 JSON。"
          : " 已保存到瀏覽器本機覆蓋詞庫。";
      setDictionaryStatus(`${statusMessage}${persistenceNote}`.trim());
      renderDictionaryEditor();
      rebuildSession();
    }

    function withEditedDictionaryCharacters(transform) {
      const characters = currentDictionaryCharacters();
      const nextCharacters = normalizeDictionaryCharacters(transform(characters));
      return { source: dictionaryState.source === "custom" ? "custom" : "edited", characters: nextCharacters };
    }

    async function addDictionaryCharacters(value) {
      const additions = normalizeDictionaryCharacters(value);
      if (!additions.length) {
        setDictionaryStatus("請輸入要添加的漢字。");
        return;
      }

      const beforeCount = currentDictionaryCharacters().length;
      const nextState = withEditedDictionaryCharacters((characters) => [...characters, ...additions]);
      const addedCount = nextState.characters.length - beforeCount;
      await applyDictionaryChange(nextState, addedCount > 0 ? `已添加 ${addedCount} 個字。` : "這些字已經在詞庫裡。");
      dictionaryAddInput.value = "";
    }

    async function removeDictionaryCharacter(char) {
      const nextState = withEditedDictionaryCharacters((characters) => characters.filter((item) => item !== char));
      await applyDictionaryChange(nextState, `已剷除「${char}」。`);
    }

    function downloadJson(payload, filename) {
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 0);
    }

    function exportDictionaryJson() {
      const payload = {
        version: 1,
        source: dictionaryState.source,
        orderMode: settings.orderMode,
        characters: currentDictionaryCharacters()
      };
      downloadJson(payload, `sucheng-dictionary-${todayKey()}.json`);
      setDictionaryStatus("已輸出 JSON。");
    }

    function importDictionaryFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        const payload = safeJsonParse(String(reader.result || ""), null);
        const characters = charactersFromDictionaryPayload(payload);
        if (!characters.length) {
          setDictionaryStatus("JSON 裡沒有找到可用漢字。");
          return;
        }

        await applyDictionaryChange(
          { source: "custom", characters },
          `已輸入 ${characters.length} 個字，將以隨機方式出題。`,
          { resetToday: true }
        );
      };
      reader.onerror = () => setDictionaryStatus("讀取 JSON 失敗，請再試一次。");
      reader.readAsText(file);
      dictionaryImportInput.value = "";
    }

    function setRecordStatus(message = "") {
      recordStatus.textContent = message;
    }

    function cloneProgressForExport() {
      return safeJsonParse(JSON.stringify(progress), { learned: {}, daily: {} });
    }

    function exportLearningRecordJson() {
      const payload = {
        version: 1,
        app: "sucheng-trainer",
        storageKey: STORAGE_KEY,
        exportedAt: new Date().toISOString(),
        progress: cloneProgressForExport()
      };
      downloadJson(payload, `sucheng-learning-record-${todayKey()}.json`);
      setRecordStatus("已輸出學習紀錄。");
    }

    function normalizeImportedProgress(payload) {
      const source = payload?.progress && typeof payload.progress === "object" ? payload.progress : payload;
      if (!source || typeof source !== "object") return null;

      const learned = source.learned && typeof source.learned === "object" ? source.learned : null;
      const daily = source.daily && typeof source.daily === "object" ? source.daily : null;
      if (!learned || !daily) return null;

      Object.values(learned).forEach(normalizeMemory);
      Object.values(daily).forEach((record) => {
        if (!record || typeof record !== "object") return;
        if (!Array.isArray(record.introduced)) record.introduced = [];
        if (!Number.isFinite(record.practiceCount)) record.practiceCount = 0;
        if (!Number.isFinite(record.bonusLimit)) record.bonusLimit = 0;
        if (typeof record.completed !== "boolean") record.completed = false;
      });

      return { learned, daily };
    }

    function importLearningRecordFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const payload = safeJsonParse(String(reader.result || ""), null);
        const importedProgress = normalizeImportedProgress(payload);
        if (!importedProgress) {
          setRecordStatus("JSON 裡沒有找到可用學習紀錄。");
          return;
        }

        const confirmed = window.confirm("匯入學習紀錄會覆蓋目前本機紀錄，確定要繼續？");
        if (!confirmed) {
          setRecordStatus("已取消匯入。");
          return;
        }

        progress = importedProgress;
        saveProgress();
        setRecordStatus("已匯入學習紀錄。");
        renderRecordPanel();
        rebuildSession();
      };
      reader.onerror = () => setRecordStatus("讀取學習紀錄失敗，請再試一次。");
      reader.readAsText(file);
      recordImportInput.value = "";
    }

    async function resetDictionaryToBuiltIn() {
      const confirmed = window.confirm("確定要還原預設的詞庫嗎？");
      if (!confirmed) return;
      await applyDictionaryChange(defaultDictionaryState(), "已還原至預設詞庫。");

    function setOrderMode(mode) {
      const nextMode = mode === "random" ? "random" : "rank";
      if (settings.orderMode === nextMode) return;

      settings.orderMode = nextMode;
      saveSettings();
      syncOrderModeButtons();

    function resetLearningProgress() {

      if (!confirmed) return;

      progress = { learned: {}, daily: {} };
      analysisState = defaultAnalysis();
      score = 0;
      answered = 0;
      saveProgress();
      saveAnalysis();
      closeSettingsMenu();
      closeRecordPanel();
      closeAnalysisPanel();

    function learnMoreNewWords() {
      const today = dailyRecord();
      const amount = learnMoreAmount(today);
      if (amount <= 0) return;

      today.bonusLimit += amount;
      today.completed = false;
      saveProgress();
      rebuildSession();
    }

    function graduateMemory(memory) {
      const now = Date.now();
      memory.lastSeen = now;
      memory.level = Math.min(
        REVIEW_INTERVALS.length - 1,
        Math.max(memory.level + 1, memory.streak >= LEARNING_STEPS_CORRECT_NEEDED ? 2 : 1)
      );
      const intervalDays = REVIEW_INTERVALS[memory.level];
      memory.nextReview = now + intervalDays * DAY_MS;
      memory.graduated = true;
      memory.learningStreak = 0;
      saveProgress();
    }

    function recordPracticeAttempt(memory, correct, usedHint = false) {
      memory.seen += 1;
      memory.lastSeen = Date.now();
      if (correct && !usedHint) {
        memory.correct += 1;
        memory.streak += 1;
        memory.learningStreak = Math.min((memory.learningStreak || 0) + 1, LEARNING_STEPS_CORRECT_NEEDED);
      } else {
        memory.wrong += 1;
        memory.streak = 0;
        memory.learningStreak = 0;
      }
      saveProgress();
    }

    // Returns the itemIndex for the current card (from learning queue or main order)
    function currentItemIndex() {
      if (currentLearningCard !== null) return currentLearningCard.itemIndex;
      return Number.isInteger(order[index]) ? order[index] : -1;
    }

    // Enqueue a card into the learning queue (avoid duplicates)
    function enqueueForLearning(itemIndex, correctStreak = 0) {
      const queuedCard = learningQueue.find((e) => e.itemIndex === itemIndex);
      const isCurrentLearning = currentLearningCard && currentLearningCard.itemIndex === itemIndex;
      if (queuedCard) {
        queuedCard.correctStreak = Math.max(queuedCard.correctStreak || 0, correctStreak);
      } else if (!isCurrentLearning) {
        insertLearningCard({ itemIndex, correctStreak });
      }
    }

    function recordAnswer(question, correct, usedHint = false) {
      const memory = memoryFor(question.char);
      const today = dailyRecord();
      today.practiceCount += 1;

      const itemIndex = currentItemIndex();

      if (currentLearningCard !== null) {
        recordPracticeAttempt(memory, correct, usedHint);
        currentLearningCard.correctStreak = memory.learningStreak || 0;
        const graduated = currentLearningCard.correctStreak >= LEARNING_STEPS_CORRECT_NEEDED;

        if (graduated) {
          graduateMemory(memory);
        } else {
          insertLearningCard({ itemIndex, correctStreak: currentLearningCard.correctStreak });
          learningInsertCountdown = Math.min(LEARNING_REINSERT_AFTER, learningQueue.length > 0 ? LEARNING_REINSERT_AFTER : 0);
        }
      } else {
        recordPracticeAttempt(memory, correct, usedHint);
        if ((memory.learningStreak || 0) >= LEARNING_STEPS_CORRECT_NEEDED) {
          graduateMemory(memory);
        } else {
          enqueueForLearning(itemIndex, memory.learningStreak || 0);
          if (learningInsertCountdown <= 0) learningInsertCountdown = LEARNING_REINSERT_AFTER;
        }
      }

      updateMemoryText();
      if (recordPanel.classList.contains("show")) renderRecordPanel();
    }

    function rootLabel(letter) {
      return rootText(letter);
    }

    function clearTimer() {
      if (nextTimer) {
        window.clearTimeout(nextTimer);
        nextTimer = null;
      }
    }

    function restartClass(el, className) {
      el.classList.remove(className);
      void el.offsetWidth;
      el.classList.add(className);
    }

    function renderWord(question) {
      wordEl.setAttribute("aria-label", question.char);
      wordEl.textContent = question.char;
    }

    function renderLoadingState(message = "載入中") {
      clearTimer();
      cancelKeyPress();
      locked = true;
      answerShown = false;
      currentRecorded = false;
      searchModeActive = false;
      heroEl.classList.remove("answer-mode", "search-mode");
      wordEl.className = "word complete";
      wordEl.textContent = message;
      wordEl.setAttribute("aria-label", message);
      if (roundRank) roundRank.hidden = true;
      answerLine.className = "answer-line";
      answerLine.innerHTML = "";
      buffer = [];
      renderBuffer();
      hintButton.disabled = true;
      hintButton.textContent = "載入詞庫";
      hintButton.classList.remove("next");
      hintButton.dataset.action = "loading";
    }

    function updateDeleteButton() {
      const activeDeleteButton = document.getElementById("deleteButton");
      if (!activeDeleteButton) return;
      activeDeleteButton.disabled = locked || buffer.length === 0;
    }

    function auxiliaryGlyphUrl(id) {
      return `${COMMONS_FILE}Cjrm-${id}.svg`;
    }

    function auxiliaryColor(name) {
      const colors = {
        red: "var(--aux-red)",
        orange: "var(--aux-orange)",
        green: "var(--aux-green)",
        magenta: "var(--aux-magenta)",
        gold: "var(--aux-gold)"
      };
      return colors[name] || "var(--aux-blue)";
    }

    function auxiliarySplitGlyphs(letter) {
      return AUXILIARY_CARD_INFO[letter]?.glyphs || [];
    }

    function auxiliaryGlyphColumns(count) {
      if (count >= 13) return 4;
      return 3;
    }

    function auxiliaryGlyphSize(count, columns) {
      if (count >= 20) return "23px";
      if (count >= 18) return "25px";
      if (count >= 14) return "29px";
      if (columns === 3 && count >= 10) return "32px";
      if (columns === 3) return "35px";
      return "33px";
    }

    function auxiliaryGlyphGap(count, columns) {
      if (columns === 3) {
        return {
          x: count >= 10 ? "8px" : "9px",
          y: count >= 10 ? "4px" : "7px"
        };
      }

      return {
        x: count >= 18 ? "2px" : "3px",
        y: count >= 18 ? "2px" : "3px"
      };
    }

    function auxiliaryBadgePair(letter) {
      const info = AUXILIARY_CARD_INFO[letter];
      if (!info) return "";
      return `
        <span class="aux-badge-pair" aria-label="${info.root} ${letter}">
          <span class="aux-root-badge" data-id="${info.rootId || ""}" style="background:${auxiliaryColor(info.color)}">${info.root}</span>
          <span class="aux-letter-badge">${letter}</span>
        </span>
      `;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function auxiliaryGlyphMarkup(glyph) {
      return `
        <span class="aux-card-glyph-wrap" data-id="${glyph.id}" data-text="${glyph.text}">
          <img class="aux-card-glyph" src="${auxiliaryGlyphUrl(glyph.glyphCode)}" alt="${glyph.text}" loading="eager" decoding="sync" fetchpriority="high">
        </span>
      `;
    }

    function preloadAuxiliaryGlyphs(letter) {
      auxiliarySplitGlyphs(letter).forEach((glyph) => {
        const url = auxiliaryGlyphUrl(glyph.glyphCode);
        if (auxiliaryGlyphPreloadUrls.has(url)) return;
        auxiliaryGlyphPreloadUrls.add(url);
        const img = new Image();
        img.decoding = "async";
        img.src = url;
      });
    }

    function warmAuxiliaryCards() {
      Object.keys(AUXILIARY_CARD_INFO).forEach((letter) => preloadAuxiliaryGlyphs(letter));
    }

    function auxiliarySpecialGrid(letter) {
      const info = AUXILIARY_CARD_INFO[letter];
      if (!info?.notes?.length) return "";
      const note = info.notes[0];
      return `
        <div class="aux-text-grid is-note">
          <div class="aux-description-cell" data-id="${note.id}" data-text="${note.text}">${note.text.replace(/\n/g, "<br>")}</div>
        </div>
      `;
    }

    function hasAuxiliaryCard(letter) {
      return AUXILIARY_CARD_LETTERS.has(letter);
    }

    function auxiliaryCardMarkup(letter, className, alt) {
      if (!hasAuxiliaryCard(letter)) return "";
      preloadAuxiliaryGlyphs(letter);
      let baseMarkup = auxiliaryCardCache.get(letter);

      if (!baseMarkup) {
        const info = AUXILIARY_CARD_INFO[letter];
        if (!info) return "";
        const glyphs = auxiliarySplitGlyphs(letter);
        const columns = auxiliaryGlyphColumns(glyphs.length);
        const gaps = auxiliaryGlyphGap(glyphs.length, columns);
        const body = glyphs.length
          ? `
            <div class="aux-card-grid" style="--aux-glyph-cols:${columns};--aux-glyph-size:${auxiliaryGlyphSize(glyphs.length, columns)};--aux-glyph-gap-x:${gaps.x};--aux-glyph-gap-y:${gaps.y};">
              ${glyphs.map((glyph) => auxiliaryGlyphMarkup(glyph)).join("")}
            </div>
          `
          : auxiliarySpecialGrid(letter);

        baseMarkup = `
          <div class="aux-card" role="img">
            <div class="aux-card-head">${auxiliaryBadgePair(letter)}</div>
            ${body}
          </div>
        `;
        auxiliaryCardCache.set(letter, baseMarkup);
      }

      return baseMarkup
        .replace('class="aux-card"', `class="aux-card ${className}"`)
        .replace('role="img"', `role="img" aria-label="${alt}"`);
    }

    function answerCard(role, label, question) {
      const part = question.decomposition?.parts?.find((item) => item.role === role);
      const letter = part?.letter || (role === "head" ? question.head : question.tail);
      const root = rootText(letter);
      const cardImage = auxiliaryCardMarkup(letter, "answer-card-img", `${root} ${letter} 輔助字型卡`);
      return `
        <div class="answer-card ${role}">
          <div class="answer-label">${label}碼 ${letter} · ${part?.auxText || root}</div>
          <div class="answer-card-img-wrap">
            ${cardImage || `<div class="answer-card-fallback">${root}：重碼鍵</div>`}
          </div>
        </div>
      `;
    }

    function createSearchQuestion(result) {
      return {
        char: result.character,
        head: result.head,
        tail: result.tail,
        decomposition: {
          parts: [
            { role: "head", letter: result.head, auxText: rootText(result.head) },
            { role: "tail", letter: result.tail, auxText: rootText(result.tail) }
          ]
        }
      };
    }

    function searchResultMarkup(result) {
      if (!result.found) {
        return `
          <div class="search-result-row">
            <div class="search-result-char">${escapeHtml(result.character || "?")}</div>
            <div class="answer-search-empty">${escapeHtml(result.message || "查無拆碼")}</div>
          </div>
        `;
      }

      const searchQuestion = createSearchQuestion(result);
      return `
        <div class="search-result-row">
          <div class="search-result-char">${escapeHtml(result.character)}</div>
          <div class="search-result-cards">
            ${answerCard("head", "頭", searchQuestion)}
            ${answerCard("tail", "尾", searchQuestion)}
          </div>
        </div>
      `;
    }

    function enterSearchMode(result) {
      searchModeActive = true;
      clearTimer();
      cancelKeyPress();
      hideKeyHint();
      locked = true;
      answerShown = false;
      renderWord({ char: result.character });
      wordEl.classList.remove("entering", "correct", "shake");
      answerLine.className = "answer-line";
      answerLine.innerHTML = "";
      heroEl.classList.remove("answer-mode");
      heroEl.classList.remove("search-list-mode");
      heroEl.classList.add("search-mode");

      if (!result.found) {
        answerLine.classList.add("show", "single");
        answerLine.innerHTML = `<div class="answer-search-empty">${escapeHtml(result.message || "查無拆碼")}</div>`;
        return;
      }

      const searchQuestion = createSearchQuestion(result);
      answerLine.innerHTML = `
        ${answerCard("head", "頭", searchQuestion)}
        ${answerCard("tail", "尾", searchQuestion)}
      `;
      answerLine.classList.add("show");
    }

    function enterSearchListMode(results) {
      searchModeActive = true;
      clearTimer();
      cancelKeyPress();
      hideKeyHint();
      locked = true;
      answerShown = false;
      wordEl.classList.remove("entering", "correct", "shake");
      answerLine.className = "answer-line search-list show";
      answerLine.innerHTML = `<div class="search-result-stack">${results.map((result) => searchResultMarkup(result)).join("")}</div>`;
      heroEl.classList.remove("answer-mode");
      heroEl.classList.add("search-mode", "search-list-mode");
    }

    function leaveSearchMode() {
      if (!searchModeActive) return;
      searchModeActive = false;
      heroEl.classList.remove("search-mode", "search-list-mode");
      renderQuestion();
    }

    function statusClass(status) {
      if (status === "code") return "is-code";
      if (status === "missing") return "is-missing";
      return "";
    }

    function renderCodePiece(label, value) {
      return `
        <div class="code-piece">
          <div class="code-piece-role">${escapeHtml(label)}</div>
          <div class="code-piece-value">${escapeHtml(value || "?")}</div>
        </div>
      `;
    }

    function renderDecompositionSearchResult(result) {
      decompositionSearchClear.classList.toggle("show", decompositionSearchInput.value.length > 0);

      if (result.status === "empty") {
        decompositionSearchResult.classList.remove("show");
        decompositionSearchResult.innerHTML = "";
        leaveSearchMode();
        return;
      }

      decompositionSearchResult.classList.remove("show");
      decompositionSearchResult.innerHTML = "";
      enterSearchMode(result);
    }

    function renderMultiCharacterSearch() {
      const chars = getHanCharacters(decompositionSearchInput.value);
      decompositionSearchClear.classList.toggle("show", decompositionSearchInput.value.length > 0);

      if (!chars.length) {
        decompositionSearchResult.classList.remove("show");
        decompositionSearchResult.innerHTML = "";
        leaveSearchMode();
        return;
      }

      const results = chars.map((char) => decomposeCharacter(char));
      decompositionSearchResult.classList.remove("show");
      decompositionSearchResult.innerHTML = "";

      if (results.length === 1) {
        renderDecompositionSearchResult(results[0]);
        return;
      }

      enterSearchListMode(results);
    }

    function runDecompositionSearch() {
      if (searchInputComposing) return;
      renderMultiCharacterSearch();
      const target = getFirstHanCharacter(decompositionSearchInput.value);

      if (target && externalCodeIndexStatus !== "ready" && externalCodeIndexStatus !== "failed") {
        ensureExternalCodeIndex().then(() => {
          if (getFirstHanCharacter(decompositionSearchInput.value) === target) {
            renderMultiCharacterSearch();
          }
        });
      }
    }

    function clearDecompositionSearch(options = {}) {
      decompositionSearchInput.value = "";
      decompositionSearchClear.classList.remove("show");
      decompositionSearchResult.classList.remove("show");
      decompositionSearchResult.innerHTML = "";
      leaveSearchMode();
      if (options.focus !== false) decompositionSearchInput.focus();
    }

    function showKeyHint(letter, keyEl) {
      const root = rootText(letter);
      const cardImage = auxiliaryCardMarkup(letter, "key-hint-card", `${root} ${letter} 輔助字型卡`);
      keyHintEl.innerHTML = `
        ${cardImage || `<div class="key-hint-fallback">${root} 是重碼鍵，沒有獨立輔助字型卡。</div>`}
      `;
      keyHintEl.classList.add("show");
      keyEl.classList.add("holding");
    }

    function hideKeyHint() {
      keyHintEl.classList.remove("show");
      document.querySelectorAll(".key.holding").forEach((key) => key.classList.remove("holding"));
    }

    function startKeyPress(letter, keyEl) {
      window.clearTimeout(holdTimer);
      holdingKey = letter;
      longPressTriggered = false;
      keyEl.classList.add("active");

      holdTimer = window.setTimeout(() => {
        longPressTriggered = true;
        showKeyHint(letter, keyEl);
      }, 280);
    }

    function finishKeyPress(letter, keyEl) {
      window.clearTimeout(holdTimer);
      holdTimer = null;
      keyEl.classList.remove("active");

      if (holdingKey !== letter) return;
      holdingKey = null;

      if (longPressTriggered) {
        window.setTimeout(hideKeyHint, 760);
        return;
      }

      hideKeyHint();
      pressKey(letter);
    }

    function cancelKeyPress() {
      window.clearTimeout(holdTimer);
      holdTimer = null;
      holdingKey = null;
      longPressTriggered = false;
      hideKeyHint();
      document.querySelectorAll(".key.active").forEach((key) => key.classList.remove("active"));
    }

    function renderKeyboard() {
      keyboardEl.innerHTML = "";
      keyboardEl.appendChild(keyHintEl);

      KEY_ROWS.forEach((row) => {
        const rowEl = document.createElement("div");
        rowEl.className = "key-row";

        row.forEach((letter) => {
          const mainRoot = getMainRoot(letter);
          const key = document.createElement("button");
          key.className = "key";
          key.type = "button";
          key.dataset.key = letter;
          if (mainRoot?.id) key.dataset.id = mainRoot.id;
          key.setAttribute("aria-label", rootLabel(letter));
          key.innerHTML = `<span class="key-letter" data-id="${mainRoot?.id || ""}">${rootText(letter)}</span>`;
          key.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            startKeyPress(letter, key);
          });
          key.addEventListener("pointerup", (event) => {
            event.preventDefault();
            finishKeyPress(letter, key);
          });
          key.addEventListener("pointerleave", cancelKeyPress);
          key.addEventListener("pointercancel", cancelKeyPress);
          key.addEventListener("contextmenu", (event) => event.preventDefault());
          rowEl.appendChild(key);
        });

        if (row === KEY_ROWS[KEY_ROWS.length - 1]) {
          const deleteKey = document.createElement("button");
          deleteKey.className = "key delete-key";
          deleteKey.type = "button";
          deleteKey.id = "deleteButton";
          deleteKey.setAttribute("aria-label", "撤回上一個輸入");
          deleteKey.innerHTML = `
            <svg class="key-delete-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path class="key-delete-shape" d="M21 5.5H9.2a2 2 0 0 0-1.6.8L3 12l4.6 5.7a2 2 0 0 0 1.6.8H21a1 1 0 0 0 1-1v-11a1 1 0 0 0-1-1Z"></path>
              <path class="key-delete-cross" d="m15.8 9.4-5.2 5.2"></path>
              <path class="key-delete-cross" d="m10.6 9.4 5.2 5.2"></path>
            </svg>
          `;
          deleteKey.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            window.clearTimeout(holdTimer);
            holdingKey = null;
            longPressTriggered = false;
            deleteKey.classList.add("active");
          });
          deleteKey.addEventListener("pointerup", (event) => {
            event.preventDefault();
            deleteKey.classList.remove("active");
            deleteLastInput();
          });
          deleteKey.addEventListener("pointerleave", () => deleteKey.classList.remove("active"));
          deleteKey.addEventListener("pointercancel", () => deleteKey.classList.remove("active"));
          deleteKey.addEventListener("contextmenu", (event) => event.preventDefault());
          rowEl.appendChild(deleteKey);
        }

        keyboardEl.appendChild(rowEl);
      });

      updateDeleteButton();
    }

    function renderBuffer(markBad = false) {
      bufferEl.innerHTML = "";

      [0, 1].forEach((slotIndex) => {
        const slot = document.createElement("div");
        const letter = buffer[slotIndex];
        slot.className = "slot";

        if (letter) {
          slot.classList.add("filled");
          if (markBad) slot.classList.add("bad");
          slot.innerHTML = `${letter}<small data-id="${rootDataId(letter)}">${rootText(letter)}</small>`;
        } else {
          slot.textContent = "—";
        }

        bufferEl.appendChild(slot);
      });

      updateDeleteButton();
    }

    function updateScore() {
      const question = currentQuestion();
      if (!question) {
        const today = dailyRecord();
        if (roundRank) roundRank.hidden = true;
        updateMemoryText();
        return;
      }
      if (roundRank) {
        const rank = Number(question.rank);
        roundRank.hidden = !Number.isFinite(rank);
        roundRank.textContent = Number.isFinite(rank) ? `#${rank}` : "";
      }
      updateMemoryText();
    }

    function renderQuestion() {
      clearTimer();
      cancelKeyPress();
      searchModeActive = false;
      heroEl.classList.remove("search-mode");
      const question = currentQuestion();
      if (!question) {
        // Check if learning queue has cards left
        if (learningQueue.length > 0) {
          currentLearningCard = takeLearningCard(lastShownItemIndex);
          learningInsertCountdown = LEARNING_REINSERT_AFTER;
          renderQuestion();
          return;
        }
        buffer = [];
        locked = true;
        answerShown = false;
        currentRecorded = false;
        heroEl.classList.remove("answer-mode");
        wordEl.className = "word complete";
        wordEl.textContent = "完成";
        wordEl.setAttribute("aria-label", "已完成今日任務");
        answerLine.className = "answer-line";
        answerLine.innerHTML = "";
        renderBuffer();
        updateScore();
        updateCompletedActionButton();
        document.querySelectorAll(".key").forEach((key) => key.classList.remove("active"));
        return;
      }
      buffer = [];
      locked = false;
      answerShown = false;
      currentRecorded = false;
      hintButton.disabled = false;
      hintButton.textContent = "不會回答 / 提示";
      hintButton.classList.remove("next");
      hintButton.dataset.action = "hint";
      heroEl.classList.remove("answer-mode");
      wordEl.className = "word";
      lastShownItemIndex = currentItemIndex();
      renderWord(question);
      answerLine.className = "answer-line";
      answerLine.innerHTML = "";
      renderBuffer();
      updateScore();
      document.querySelectorAll(".key").forEach((key) => key.classList.remove("active"));
      restartClass(wordEl, "entering");
    }

    function rebuildSession(options = {}) {
      clearTimer();
      clearDecompositionSearch({ focus: options.focusSearch === true });
      order = createQuestionOrder();
      index = 0;
      sessionTotal = order.length;
      buffer = [];
      locked = false;
      answerShown = false;
      learningQueue = [];
      currentLearningCard = null;
      learningInsertCountdown = 0;
      lastShownItemIndex = -1;
      renderQuestion();
    }

    function deleteLastInput() {
      if (searchModeActive) return;
      if (locked || buffer.length === 0) return;
      buffer.pop();
      renderBuffer();
    }

    function pressKey(letter) {
      if (searchModeActive) return;
      if (locked || buffer.length >= 2) return;

      const keyEl = document.querySelector(`[data-key="${letter}"]`);
      if (keyEl && !keyEl.classList.contains("active")) {
        keyEl.classList.add("active");
        window.setTimeout(() => keyEl.classList.remove("active"), 110);
      }

      buffer.push(letter);
      renderBuffer();

      if (buffer.length === 2) {
        checkAnswer();
      }
    }

    function checkAnswer() {
      const question = currentQuestion();
      locked = true;
      hintButton.disabled = true;
      updateDeleteButton();

      const correct = buffer[0] === question.head && buffer[1] === question.tail;
      recordInputAnalysis(question, [...buffer]);
      if (correct) {
        score += 1;
        answered += 1;
        currentRecorded = true;
        recordAnswer(question, true);
        updateScore();
        wordEl.classList.remove("entering");
        restartClass(wordEl, "correct");
        nextTimer = window.setTimeout(() => {
          nextQuestion();
        }, 500);
      } else {
        answered += 1;
        currentRecorded = true;
        recordAnswer(question, false);
        updateScore();
        renderBuffer(true);
        revealAnswer("wrong");
      }
    }

    function revealAnswer(reason = "hint") {
      if (searchModeActive) return;
      const question = currentQuestion();
      cancelKeyPress();
      locked = true;
      answerShown = true;
      hintButton.disabled = false;
      hintButton.textContent = "下一題";
      hintButton.classList.add("next");
      hintButton.dataset.action = "next";
      updateDeleteButton();

      if (reason === "hint" && !currentRecorded) {
        answered += 1;
        currentRecorded = true;
        recordSkippedAnalysis(question);
        recordAnswer(question, false, true);
        updateScore();
      }

      wordEl.classList.remove("entering", "correct");
      restartClass(wordEl, "shake");

      answerLine.innerHTML = `
        ${answerCard("head", "頭", question)}
        ${answerCard("tail", "尾", question)}
      `;
      answerLine.classList.add("show");
      heroEl.classList.add("answer-mode");
    }

    function nextQuestion() {
      clearTimer();

      pickNextCard();

      // If showing a learning card, just render it
      if (currentLearningCard !== null) {
        renderQuestion();
        return;
      }

      // Otherwise we advanced index — check bounds
      if (index >= order.length) {
        // If there are still learning cards pending, keep going
        if (learningQueue.length > 0) {
          currentLearningCard = takeLearningCard(lastShownItemIndex);
          learningInsertCountdown = LEARNING_REINSERT_AFTER;
          renderQuestion();
          return;
        }

        const today = dailyRecord();
        today.completed = isDailyTaskComplete(today);
        if (today.completed) {
          renderQuestion();
          return;
        }
        rebuildSession();
        return;
      }

      renderQuestion();
    }

    hintButton.addEventListener("click", () => {
      if (searchModeActive) return;
      if (hintButton.dataset.action === "learn-more") {
        learnMoreNewWords();
        return;
      }
      if (answerShown) {
        nextQuestion();
        return;
      }

      if (!locked) revealAnswer("hint");
    });

    settingsButton.addEventListener("click", (event) => {
      event.stopPropagation();
      setSettingsMenu(!settingsMenu.classList.contains("show"));
    });

    settingsMenu.addEventListener("click", (event) => {
      event.stopPropagation();
    });

    orderModeSwitch.addEventListener("click", () => {
      setOrderMode(settings.orderMode === "random" ? "rank" : "random");
    });

    recordButton.addEventListener("click", (event) => {
      event.stopPropagation();
      setRecordPanel(true);
    });

    analysisButton.addEventListener("click", (event) => {
      event.stopPropagation();
      setAnalysisPanel(true);
    });

    editDictionaryButton.addEventListener("click", (event) => {
      event.stopPropagation();
      setDictionaryPanel(true);
    });

    recordPanel.addEventListener("click", closeRecordPanel);

    recordPanel.querySelector(".record-sheet").addEventListener("click", (event) => {
      event.stopPropagation();
    });

    recordCloseButton.addEventListener("click", closeRecordPanel);

    analysisPanel.addEventListener("click", closeAnalysisPanel);

    analysisPanel.querySelector(".analysis-sheet").addEventListener("click", (event) => {
      event.stopPropagation();
    });

    analysisCloseButton.addEventListener("click", closeAnalysisPanel);

    dictionaryPanel.addEventListener("click", closeDictionaryPanel);

    dictionaryPanel.querySelector(".dictionary-sheet").addEventListener("click", (event) => {
      event.stopPropagation();
    });

    dictionaryCloseButton.addEventListener("click", closeDictionaryPanel);

    dictionaryAddForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (dictionaryInputComposing) return;
      addDictionaryCharacters(dictionaryAddInput.value);
    });

    dictionaryList.addEventListener("click", (event) => {
      const button = event.target.closest(".dictionary-delete-button[data-char]");
      if (!button) return;
      removeDictionaryCharacter(button.dataset.char);
    });

    dictionaryExportButton.addEventListener("click", exportDictionaryJson);
    dictionaryImportButton.addEventListener("click", () => dictionaryImportInput.click());
    dictionaryImportInput.addEventListener("change", () => importDictionaryFile(dictionaryImportInput.files?.[0]));
    dictionaryResetButton.addEventListener("click", resetDictionaryToBuiltIn);
    recordExportButton.addEventListener("click", exportLearningRecordJson);
    recordImportButton.addEventListener("click", () => recordImportInput.click());
    recordImportInput.addEventListener("change", () => importLearningRecordFile(recordImportInput.files?.[0]));

    recordTableWrap.addEventListener("click", (event) => {
      const button = event.target.closest("[data-sort-key]");
      if (!button) return;

      const key = button.dataset.sortKey;
      recordSort = {
        key,
        direction: recordSort.key === key && recordSort.direction === "desc" ? "asc" : "desc"
      };
      renderRecordPanel();
    });

    dailyLimitButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const nextLimit = normalizeDailyLimit(button.dataset.dailyLimit);
        if (settings.dailyLimit === nextLimit) return;
        settings.dailyLimit = nextLimit;
        syncDailyLimitButtons();
        saveSettings();
        trimTodayIntroducedToLimit();
        rebuildSession();
      });
    });

    resetProgressButton.addEventListener("click", resetLearningProgress);

    decompositionSearchForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (searchInputComposing) return;
      runDecompositionSearch();
    });

    decompositionSearchInput.addEventListener("input", runDecompositionSearch);
    decompositionSearchClear.addEventListener("click", clearDecompositionSearch);

    dictionaryAddInput.addEventListener("compositionstart", () => {
      dictionaryInputComposing = true;
    });

    dictionaryAddInput.addEventListener("compositionend", () => {
      dictionaryInputComposing = false;
    });

    decompositionSearchInput.addEventListener("compositionstart", () => {
      searchInputComposing = true;
    });

    decompositionSearchInput.addEventListener("compositionend", () => {
      searchInputComposing = false;
      runDecompositionSearch();
    });

    [dictionaryAddInput, decompositionSearchInput].forEach((input) => {
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && event.isComposing) {
          event.preventDefault();
        }
      });
    });

    document.addEventListener("click", closeSettingsMenu);

    ["touchstart", "selectstart", "dragstart"].forEach((eventName) => {
      keyboardEl.addEventListener(eventName, (event) => {
        event.preventDefault();
      }, { passive: false });
    });

    window.addEventListener("keydown", (event) => {
      const target = event.target;
      if (target instanceof HTMLElement) {
        const isEditable = target === decompositionSearchInput
          || target === dictionaryAddInput
          || target.isContentEditable
          || target.tagName === "INPUT"
          || target.tagName === "TEXTAREA"
          || target.tagName === "SELECT";
        if (isEditable) return;
      }

      if (event.key === "Escape") {
        closeRecordPanel();
        closeAnalysisPanel();
        closeDictionaryPanel();
        closeSettingsMenu();
        hideKeyHint();
        clearDecompositionSearch();
        return;
      }

      if (event.key === "Backspace" || event.key === "Delete") {
        event.preventDefault();
        deleteLastInput();
        return;
      }

      if (event.key === "Enter" && answerShown) {
        event.preventDefault();
        nextQuestion();
        return;
      }

      const key = event.key.toUpperCase();
      if (getMainRoot(key)) {
        event.preventDefault();
        pressKey(key);
      }
    });

    document.addEventListener("gesturestart", (event) => event.preventDefault());

    window.decomposeCharacter = decomposeCharacter;

    async function initializeApp() {
      renderKeyboard();
      renderLoadingState("載入中");
      await Promise.all([loadBuiltInDictionarySource(), ensureExternalCodeIndex()]);
      dictionaryState = await hydrateDictionaryState();
      rebuildBuiltInDictionary();
      rebuildActiveDictionary();
      saveDictionaryState();
      rebuildSession();
      warmAuxiliaryCards();
    }

    initializeApp();
  </script>
</body>
</html>
