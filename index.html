    const CODE_BY_CHARACTER = Object.fromEntries(SUCHENG_CODE_INDEX.map((item) => [item.character, item]));
    const CANGJIE_INDEX_SOURCES = [
      { url: "cangjie5-index.json", label: "Rime 倉頡五代" },
      { url: "unihan-cangjie-index.json", label: "Unicode Unihan kCangjie" }
    ];
    let externalCodeByCharacter = {};
    let externalCodeIndexPromise = null;
    let externalCodeIndexStatus = "idle";
    const AUX_GLYPH_CODE_TO_DATA_ID = buildAuxiliaryGlyphCodeIndex();
    const AUXILIARY_RADICAL_BY_SEMANTIC_ID = buildAuxiliaryRadicalCatalogIndex();

    function buildAuxiliaryGlyphCodeIndex() {
      const index = {};
      Object.values(AUXILIARY_CARD_INFO).forEach((card) => {
        card.glyphs.forEach((glyph) => {
          index[glyph.glyphCode] = glyph.id;
        });
        card.notes.forEach((note) => {
          index[note.text] = note.id;
        });
      });
      return index;
    }

    function buildAuxiliaryRadicalCatalogIndex() {
      return Object.fromEntries(
        AUXILIARY_RADICAL_CATALOG.map((radical) => {
          const id = radical.glyphCode
            ? AUX_GLYPH_CODE_TO_DATA_ID[radical.glyphCode]
            : AUXILIARY_CARD_INFO[radical.noteLetter]?.notes?.[0]?.id;
          return [
            radical.semanticId,
            {
              ...radical,
              id: id || "",
              letter: radical.semanticId.split("_")[0]
            }
          ];
        })
      );
    }

    function auxiliaryRadicalBySemanticId(semanticId) {
      return AUXILIARY_RADICAL_BY_SEMANTIC_ID[semanticId] || null;
    }

    function createDecompositionPart(role, letter, semanticId, answerText) {
      const mainRoot = getMainRoot(letter);
      const radical = auxiliaryRadicalBySemanticId(semanticId);
      return {
        role,
        letter,
        mainId: mainRoot?.id || "",
        mainText: mainRoot?.text || letter,
        semanticId: semanticId || "",
        auxId: radical?.id || "",
        auxText: radical?.text || answerText?.split("：")[1] || mainRoot?.text || letter,
        auxLabel: radical?.label || answerText || `${rootText(letter)}：${rootText(letter)}`,
        answerText: answerText || radical?.label || `${rootText(letter)}：${rootText(letter)}`,
        precise: Boolean(radical?.id)
      };
    }

    function normalizeDictionaryEntry(item, codeInfo) {
      return {
        ...item,
        char: item.character,
        head: codeInfo.head,
        tail: codeInfo.tail,
        code: codeInfo.code,
        answerText: {
          head: item["首碼答案"],
          tail: item["尾碼答案"]
        },
        decomposition: {
          source: "training-radical-index",
          confidence: "precise",
          parts: [
            createDecompositionPart("head", codeInfo.head, item["首碼輔助字型ID"], item["首碼答案"]),
            createDecompositionPart("tail", codeInfo.tail, item["尾碼輔助字型ID"], item["尾碼答案"])
          ]
        }
      };
    }

    const DICTIONARY = SOURCE_CHARACTERS
      .map((item) => {
        const codeInfo = CODE_BY_CHARACTER[item.character];
        if (!codeInfo) return null;
        return normalizeDictionaryEntry(item, codeInfo);
      })
      .filter(Boolean)
      .sort((a, b) => a.rank - b.rank);
    const DICTIONARY_BY_CHARACTER = Object.fromEntries(DICTIONARY.map((item) => [item.char, item]));
    const DICTIONARY_CHAR_SET = new Set(DICTIONARY.map((item) => item.char));

    function codeInfoForCharacter(character) {
      const builtIn = CODE_BY_CHARACTER[character];
      if (builtIn) return { ...builtIn, sourceLabel: "本站練習碼表" };
      return externalCodeByCharacter[character] || null;
    }

    function ensureExternalCodeIndex() {
      if (externalCodeIndexPromise) return externalCodeIndexPromise;
      externalCodeIndexStatus = "loading";
      externalCodeIndexPromise = Promise.all(
        CANGJIE_INDEX_SOURCES.map((source) =>
          fetch(source.url)
            .then((response) => {
              if (!response.ok) throw new Error(`${source.url} HTTP ${response.status}`);
              return response.json();
            })
            .then((payload) => ({ source, rows: payload.rows || [] }))
        )
      )
        .then((payloads) => {
          const externalIndex = {};
          payloads.forEach(({ source, rows }) => {
            rows.forEach((item) => {
              if (!item.character || externalIndex[item.character]) return;
              externalIndex[item.character] = { ...item, sourceLabel: source.label };
            });
          });
          externalCodeByCharacter = externalIndex;
          externalCodeIndexStatus = "ready";
          return externalIndex;
        })
        .catch((error) => {
          console.warn("Cangjie table load failed", error);
          externalCodeIndexStatus = "failed";
          return {};
        });
      return externalCodeIndexPromise;
    }

    function getFirstHanCharacter(value) {
      return Array.from((value || "").trim()).find((char) => /\p{Script=Han}/u.test(char)) || "";
    }

    function decomposeCharacter(char) {
      const target = getFirstHanCharacter(char);
      if (!target) {
        return {
          found: false,
          status: "empty",
          character: "",
          message: "輸入一個漢字後，系統會查詢倉頡/速成完整碼與速成頭尾碼。"
        };
      }

      const codeInfo = codeInfoForCharacter(target);
      if (codeInfo) {
        return {
          found: true,
          status: "code",
          character: target,
          code: codeInfo.code,
          head: codeInfo.head,
          tail: codeInfo.tail,
          source: codeInfo.sourceLabel || "本地碼表",
          confidenceLabel: "碼表",
          note: `${codeInfo.sourceLabel || "本地碼表"}`
        };
      }

      return {
        found: false,
        status: "missing",
        character: target,
        message: externalCodeIndexStatus === "failed"
          ? "本地倉頡碼表載入失敗，目前查不到這個字。"
          : "本地倉頡碼表正在載入；載入完成後會自動補查這個字。"
      };
    }

    const STORAGE_KEY = "suchengTrainerSrs.v2";
    const SETTINGS_KEY = "suchengTrainerSettings.v1";
    const DAY_MS = 24 * 60 * 60 * 1000;
    const REVIEW_INTERVALS = [0, 1, 3, 7, 14, 30, 60, 120];

    const wordEl = document.getElementById("word");
    const heroEl = document.querySelector(".hero");
    const bufferEl = document.getElementById("buffer");
    const answerLine = document.getElementById("answerLine");
    const keyboardEl = document.getElementById("keyboard");
    const keyHintEl = document.getElementById("keyHint");
    const hintButton = document.getElementById("hintButton");
    const deleteButton = document.getElementById("deleteButton");
    const roundText = document.getElementById("roundText");
    const settingsButton = document.getElementById("settingsButton");
    const settingsMenu = document.getElementById("settingsMenu");
    const dailyLimitSelect = document.getElementById("dailyLimit");
    const recordButton = document.getElementById("recordButton");
    const resetProgressButton = document.getElementById("resetProgressButton");
    const recordPanel = document.getElementById("recordPanel");
    const recordCloseButton = document.getElementById("recordCloseButton");
    const recordSubtitle = document.getElementById("recordSubtitle");
    const recordSummary = document.getElementById("recordSummary");
    const recordTableWrap = document.getElementById("recordTableWrap");
    const studyStrip = document.querySelector(".study-strip");
    const memoryText = document.getElementById("memoryText");
    const learnMoreButton = document.getElementById("learnMoreButton");
    const decompositionSearchForm = document.getElementById("decompositionSearch");
    const decompositionSearchInput = document.getElementById("decompositionSearchInput");
    const decompositionSearchClear = document.getElementById("decompositionSearchClear");
    const decompositionSearchResult = document.getElementById("decompositionSearchResult");

    let settings = loadSettings();
    let progress = loadProgress();
    let order = createQuestionOrder();
    let index = 0;
    let buffer = [];
    let locked = false;
    let answerShown = false;
    let currentRecorded = false;
    let score = 0;
    let answered = 0;
    let sessionTotal = order.length;
    let nextTimer = null;
    let holdTimer = null;
    let holdingKey = null;
    let longPressTriggered = false;
    let recordSort = { key: "default", direction: "desc" };
    let searchModeActive = false;
    const auxiliaryCardCache = new Map();
    const auxiliaryGlyphPreloadUrls = new Set();

    // Anki-style learning queue: cards stay here until they graduate (2 correct in a row)
    // Each entry: { itemIndex, correctStreak }
    const LEARNING_STEPS_CORRECT_NEEDED = 2; // consecutive correct answers to graduate
    const LEARNING_REINSERT_AFTER = 3;       // re-show after this many other cards
    let learningQueue = [];       // { itemIndex, correctStreak }
    let currentLearningCard = null; // { itemIndex, correctStreak } — the card being shown now (if from queue)
    let learningInsertCountdown = 0; // cards until next learning card appears

    dailyLimitSelect.value = String(settings.dailyLimit);

    function todayKey(time = Date.now()) {
      const date = new Date(time);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function safeJsonParse(value, fallback) {
      try {
        return value ? JSON.parse(value) : fallback;
      } catch {
        return fallback;
      }
    }

    function storageGet(key) {
      try {
        return localStorage.getItem(key);
      } catch {
        return null;
      }
    }

    function storageSet(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch {
        // Practice still works if the browser blocks local storage.
      }
    }

    function loadSettings() {
      const saved = safeJsonParse(storageGet(SETTINGS_KEY), {});
      const dailyLimit = Number(saved.dailyLimit) || 10;
      return { dailyLimit: Math.min(50, Math.max(5, dailyLimit)) };
    }

    function saveSettings() {
      storageSet(SETTINGS_KEY, JSON.stringify(settings));
    }

    function loadProgress() {
      const saved = safeJsonParse(storageGet(STORAGE_KEY), null);
      if (!saved || typeof saved !== "object") {
        return { learned: {}, daily: {} };
      }

      return {
        learned: saved.learned && typeof saved.learned === "object" ? saved.learned : {},
        daily: saved.daily && typeof saved.daily === "object" ? saved.daily : {}
      };
    }

    function saveProgress() {
      storageSet(STORAGE_KEY, JSON.stringify(progress));
    }

    function defaultMemory() {
      return {
        seen: 0,
        correct: 0,
        wrong: 0,
        streak: 0,
        level: 0,
        nextReview: 0,
        lastSeen: 0
      };
    }

    function memoryFor(char) {
      if (!progress.learned[char]) progress.learned[char] = defaultMemory();
      return progress.learned[char];
    }

    function dailyRecord() {
      const key = todayKey();
      if (!progress.daily[key]) progress.daily[key] = { introduced: [], practiceCount: 0, bonusLimit: 0, completed: false };
      if (!Array.isArray(progress.daily[key].introduced)) {
        progress.daily[key].introduced = [];
      }
      const seenChars = new Set();
      progress.daily[key].introduced = progress.daily[key].introduced.filter((char) => {
        if (!DICTIONARY_CHAR_SET.has(char) || seenChars.has(char)) return false;
        seenChars.add(char);
        return true;
      });
      if (!Number.isFinite(progress.daily[key].practiceCount)) {
        progress.daily[key].practiceCount = 0;
      }
      if (!Number.isFinite(progress.daily[key].bonusLimit)) {
        progress.daily[key].bonusLimit = 0;
      }
      if (typeof progress.daily[key].completed !== "boolean") {
        progress.daily[key].completed = false;
      }
      return progress.daily[key];
    }

    function trimTodayIntroducedToLimit() {
      const today = dailyRecord();
      if (today.introduced.length <= settings.dailyLimit) return;

      const keep = [];
      const removable = [];
      today.introduced.forEach((char) => {
        const memory = progress.learned[char];
        if (memory && memory.seen > 0) {
          keep.push(char);
        } else {
          removable.push(char);
        }
      });

      today.introduced = [...keep, ...removable].slice(0, Math.max(settings.dailyLimit, keep.length));
      saveProgress();
    }

    function reviewPriority(a, b, now = Date.now()) {
      const aMemory = a.memory;
      const bMemory = b.memory;
      const aDue = aMemory.nextReview <= now ? 1 : 0;
      const bDue = bMemory.nextReview <= now ? 1 : 0;
      if (aDue !== bDue) return bDue - aDue;

      const levelDiff = (aMemory.level || 0) - (bMemory.level || 0);
      if (levelDiff) return levelDiff;

      const aWrongRate = (aMemory.wrong || 0) / Math.max(1, aMemory.seen || 0);
      const bWrongRate = (bMemory.wrong || 0) / Math.max(1, bMemory.seen || 0);
      if (aWrongRate !== bWrongRate) return bWrongRate - aWrongRate;

      const wrongDiff = (bMemory.wrong || 0) - (aMemory.wrong || 0);
      if (wrongDiff) return wrongDiff;

      return (aMemory.nextReview || 0) - (bMemory.nextReview || 0) || a.item.rank - b.item.rank;
    }

    function interleaveNewItems(reviewItems, newItems) {
      const result = [];
      const newQueue = [...newItems];

      reviewItems.forEach((itemIndex, position) => {
        result.push(itemIndex);
        if ((position + 1) % 2 === 0 && newQueue.length) {
          result.push(newQueue.shift());
        }
      });

      return [...result, ...newQueue];
    }

    function dueReviewIndexes(now = Date.now()) {
      return DICTIONARY
        .map((item, itemIndex) => ({ item, itemIndex, memory: progress.learned[item.char] }))
        .filter(({ memory }) => memory && memory.seen > 0 && memory.nextReview <= now)
        .sort((a, b) => reviewPriority(a, b, now))
        .map(({ itemIndex }) => itemIndex);
    }

    function introduceNewWords(today) {
      const introduced = new Set(today.introduced);
      const remainingNewSlots = Math.max(0, todayNewLimit(today) - introduced.size);
      if (remainingNewSlots <= 0) return;

      for (let i = 0; i < DICTIONARY.length && today.introduced.length < todayNewLimit(today); i += 1) {
        const item = DICTIONARY[i];
        const memory = progress.learned[item.char];
        if ((memory && memory.seen > 0) || introduced.has(item.char)) continue;
        introduced.add(item.char);
        today.introduced.push(item.char);
      }
    }

    function pendingNewIndexes(today) {
      return today.introduced
        .map((char) => DICTIONARY.findIndex((item) => item.char === char))
        .filter((itemIndex) => {
          if (itemIndex < 0) return false;
          const memory = progress.learned[DICTIONARY[itemIndex].char];
          return !memory || memory.seen <= 0;
        });
    }

    function createQuestionOrder() {
      const requestedChar = new URLSearchParams(window.location.search).get("char");
      const requestedIndex = DICTIONARY.findIndex((item) => item.char === requestedChar);

      const now = Date.now();
      const today = dailyRecord();
      introduceNewWords(today);

      const reviewOrder = dueReviewIndexes(now);
      const pendingOrder = pendingNewIndexes(today);
      const uniqueOrder = interleaveNewItems(reviewOrder, pendingOrder);

      if (requestedIndex !== -1) {
        return [requestedIndex, ...uniqueOrder.filter((itemIndex) => itemIndex !== requestedIndex)];
      }

      today.completed = isDailyTaskComplete(today, now);
      saveProgress();
      return uniqueOrder;
    }

    function currentQuestion() {
      if (currentLearningCard !== null) {
        return DICTIONARY[currentLearningCard.itemIndex] || null;
      }
      return Number.isInteger(order[index]) ? DICTIONARY[order[index]] : null;
    }

    function isLearningCard() {
      return currentLearningCard !== null;
    }

    // Decide the next card to show: learning queue or advance index
    function pickNextCard() {
      currentLearningCard = null;

      // Time to show a learning card?
      if (learningQueue.length > 0) {
        if (learningInsertCountdown <= 0) {
          currentLearningCard = learningQueue.shift();
          learningInsertCountdown = LEARNING_REINSERT_AFTER;
          return;
        }
        learningInsertCountdown -= 1;
      }

      // Otherwise advance the main order
      index += 1;
    }

    function countDueReviews(now = Date.now()) {
      return DICTIONARY.reduce((count, item) => {
        const memory = progress.learned[item.char];
        return count + (memory && memory.seen > 0 && memory.nextReview <= now ? 1 : 0);
      }, 0);
    }

    function nextDueReviewTime(now = Date.now()) {
      return DICTIONARY.reduce((soonest, item) => {
        const memory = progress.learned[item.char];
        if (!memory || memory.seen <= 0 || !Number.isFinite(memory.nextReview) || memory.nextReview <= now) {
          return soonest;
        }
        return Math.min(soonest, memory.nextReview);
      }, Infinity);
    }

    function todayDisplayText() {
      const date = new Date();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${month}/${day}`;
    }

    function todayNewLimit(today = dailyRecord()) {
      return settings.dailyLimit + (today.bonusLimit || 0);
    }

    function todayIntroducedLearnedCount(today = dailyRecord()) {
      return today.introduced.reduce((count, char) => {
        const memory = progress.learned[char];
        return count + (memory && memory.seen > 0 ? 1 : 0);
      }, 0);
    }

    function todayIntroducedPendingCount(today = dailyRecord()) {
      return today.introduced.reduce((count, char) => {
        const memory = progress.learned[char];
        return count + ((memory && memory.seen > 0) ? 0 : 1);
      }, 0);
    }

    function remainingUnseenWordCount(today = dailyRecord()) {
      const introduced = new Set(today.introduced);
      return DICTIONARY.reduce((count, item) => {
        const memory = progress.learned[item.char];
        if ((memory && memory.seen > 0) || introduced.has(item.char)) return count;
        return count + 1;
      }, 0);
    }

    function isDailyTaskComplete(today = dailyRecord(), now = Date.now()) {
      return !hasDueReviewNow(now)
        && todayIntroducedPendingCount(today) === 0
        && todayIntroducedLearnedCount(today) >= todayNewLimit(today);
    }

    function canLearnMoreToday(today = dailyRecord()) {
      const base = settings.dailyLimit;
      const maxBonus = Math.max(3, Math.ceil(base * 0.5));
      return isDailyTaskComplete(today)
        && remainingUnseenWordCount(today) > 0
        && (today.bonusLimit || 0) < maxBonus;
    }

    function learnMoreAmount(today = dailyRecord()) {
      const base = settings.dailyLimit;
      const maxBonus = Math.max(3, Math.ceil(base * 0.5));
      const currentBonus = today.bonusLimit || 0;
      const remainingNewWords = remainingUnseenWordCount(today);
      return Math.min(Math.max(0, maxBonus - currentBonus), remainingNewWords);
    }

    function updateMemoryText() {
      const today = dailyRecord();
      const learnedCount = Object.keys(progress.learned).length;
      const dueCount = countDueReviews();
      const learnedToday = todayIntroducedLearnedCount(today);
      const showLearnMore = canLearnMoreToday(today);
      const completed = isDailyTaskComplete(today);
      const nextDue = nextDueReviewTime();
      memoryText.textContent = completed
        ? `已完成今日任務 · 下次複習 ${Number.isFinite(nextDue) ? formatDateTime(nextDue) : "無"}`
        : `新字 ${learnedToday}/${todayNewLimit(today)} · 複習 ${dueCount} · 已學 ${learnedCount}`;
      learnMoreButton.classList.toggle("show", showLearnMore);
      studyStrip.classList.toggle("learn-more-ready", showLearnMore);
      today.completed = completed;
    }

    function hasDueReviewNow(now = Date.now()) {
      return DICTIONARY.some((item) => {
        const memory = progress.learned[item.char];
        return memory && memory.seen > 0 && memory.nextReview <= now;
      });
    }

    function formatDateTime(time) {
      if (!time) return "未排程";
      const date = new Date(time);
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      const hour = String(date.getHours()).padStart(2, "0");
      const minute = String(date.getMinutes()).padStart(2, "0");
      return `${month}/${day} ${hour}:${minute}`;
    }

    function percent(value) {
      return `${Math.round(value * 100)}%`;
    }

    function accuracyValue(memory) {
      return (memory.correct || 0) / Math.max(1, (memory.correct || 0) + (memory.wrong || 0));
    }

    function recordSortValue(row, key) {
      const memory = row.memory;
      if (key === "seen") return memory.seen || 0;
      if (key === "accuracy") return accuracyValue(memory);
      if (key === "streak") return memory.streak || 0;
      if (key === "nextReview") return memory.nextReview || 0;
      return 0;
    }

    function defaultLearningRowCompare(a, b) {
      const wrongDiff = (b.memory.wrong || 0) - (a.memory.wrong || 0);
      if (wrongDiff) return wrongDiff;
      return (b.memory.lastSeen || 0) - (a.memory.lastSeen || 0) || a.item.rank - b.item.rank;
    }

    function compareLearningRows(a, b) {
      if (recordSort.key === "default") return defaultLearningRowCompare(a, b);

      const direction = recordSort.direction === "asc" ? 1 : -1;
      const diff = recordSortValue(a, recordSort.key) - recordSortValue(b, recordSort.key);
      if (diff) return diff * direction;
      return defaultLearningRowCompare(a, b);
    }

    function sortControl(key, label) {
      const active = recordSort.key === key;
      const direction = active ? recordSort.direction : "desc";
      const orderText = direction === "asc" ? "順序" : "倒序";
      return `
        <span class="record-sort-head">
          <span>${label}</span>
          <button
            class="record-sort-button"
            type="button"
            data-sort-key="${key}"
            data-direction="${direction}"
            aria-pressed="${active ? "true" : "false"}"
            aria-label="${label}${active ? `目前${orderText}` : "排序"}"
            title="${label}${active ? `：${orderText}` : "排序"}"
          ></button>
        </span>
      `;
    }

    function learningRows() {
      return DICTIONARY
        .map((item) => ({ item, memory: progress.learned[item.char] }))
        .filter(({ memory }) => memory && memory.seen > 0)
        .sort(compareLearningRows);
    }

    function renderRecordPanel() {
      const rows = learningRows();
      const totalSeen = rows.reduce((sum, row) => sum + (row.memory.seen || 0), 0);
      const totalCorrect = rows.reduce((sum, row) => sum + (row.memory.correct || 0), 0);
      const totalWrong = rows.reduce((sum, row) => sum + (row.memory.wrong || 0), 0);
      const dueCount = countDueReviews();

      const today = dailyRecord();
      recordSubtitle.textContent = `已學 ${rows.length} 個單字 · 今日新字 ${todayIntroducedLearnedCount(today)}/${todayNewLimit(today)}`;
      recordSummary.innerHTML = `
        <div class="record-stat"><strong>${rows.length}</strong><span>已學單字</span></div>
        <div class="record-stat"><strong>${totalSeen}</strong><span>練習次數</span></div>
        <div class="record-stat"><strong>${percent(totalCorrect / Math.max(1, totalCorrect + totalWrong))}</strong><span>總正確率</span></div>
        <div class="record-stat"><strong>${dueCount}</strong><span>待複習</span></div>
      `;

      if (!rows.length) {
        recordTableWrap.innerHTML = `<div class="record-empty">完成一次練習後，這裡會顯示每個單字的學習次數、正確次數、錯誤次數和下次複習時間。</div>`;
        return;
      }

      const body = rows.map(({ item, memory }) => {
        const attempts = memory.seen || 0;
        const correct = memory.correct || 0;
        const wrong = memory.wrong || 0;
        const rate = percent(accuracyValue(memory));
        return `
          <tr>
            <td><span class="record-char">${item.char}</span></td>
            <td>#${item.rank}</td>
            <td>${item.head}${item.tail}</td>
            <td>${attempts}</td>
            <td>${correct}</td>
            <td>${wrong}</td>
            <td>${rate}</td>
            <td>${memory.streak || 0}</td>
            <td>${formatDateTime(memory.nextReview)}</td>
          </tr>
        `;
      }).join("");

      recordTableWrap.innerHTML = `
        <table class="record-table">
          <thead>
            <tr>
              <th>單字</th>
              <th>Rank</th>
              <th>碼</th>
              <th>${sortControl("seen", "次數")}</th>
              <th>正確</th>
              <th>錯誤</th>
              <th>${sortControl("accuracy", "正確率")}</th>
              <th>${sortControl("streak", "連勝")}</th>
              <th>${sortControl("nextReview", "下次複習")}</th>
            </tr>
          </thead>
          <tbody>${body}</tbody>
        </table>
      `;
    }

    function setRecordPanel(open) {
      if (open) {
        renderRecordPanel();
        closeSettingsMenu();
      }

      recordPanel.classList.toggle("show", open);
      recordPanel.setAttribute("aria-hidden", open ? "false" : "true");
    }

    function closeRecordPanel() {
      setRecordPanel(false);
    }

    function setSettingsMenu(open) {
      settingsMenu.classList.toggle("show", open);
      settingsMenu.setAttribute("aria-hidden", open ? "false" : "true");
      settingsButton.setAttribute("aria-expanded", open ? "true" : "false");
    }

    function closeSettingsMenu() {
      setSettingsMenu(false);
    }

    function resetLearningProgress() {
      const confirmed = window.confirm("確定要重設所有學習紀錄？");
      if (!confirmed) return;

      progress = { learned: {}, daily: {} };
      score = 0;
      answered = 0;
      saveProgress();
      closeSettingsMenu();
      closeRecordPanel();
      rebuildSession();
    }

    function learnMoreNewWords() {
      const today = dailyRecord();
      const amount = learnMoreAmount(today);
      if (amount <= 0) return;

      today.bonusLimit += amount;
      today.completed = false;
      saveProgress();
      rebuildSession();
    }

    function scheduleReview(memory, correct, usedHint = false) {
      const now = Date.now();
      memory.seen += 1;
      memory.lastSeen = now;

      if (correct && !usedHint) {
        memory.correct += 1;
        memory.streak += 1;
        memory.level = Math.min(REVIEW_INTERVALS.length - 1, Math.max(memory.level + 1, memory.streak >= 2 ? 2 : 1));
      } else {
        memory.wrong += 1;
        memory.streak = 0;
        memory.level = Math.max(0, memory.level - 1);
      }

      const wrongRate = memory.wrong / Math.max(1, memory.seen);
      const intervalDays = correct && !usedHint
        ? REVIEW_INTERVALS[memory.level]
        : wrongRate >= 0.5 ? 0.04 : 0.17;

      memory.nextReview = now + intervalDays * DAY_MS;
      saveProgress();
    }

    // Returns the itemIndex for the current card (from learning queue or main order)
    function currentItemIndex() {
      if (currentLearningCard !== null) return currentLearningCard.itemIndex;
      return Number.isInteger(order[index]) ? order[index] : -1;
    }

    // Enqueue a card into the learning queue (avoid duplicates)
    function enqueueForLearning(itemIndex) {
      const alreadyQueued = learningQueue.some((e) => e.itemIndex === itemIndex);
      const isCurrentLearning = currentLearningCard && currentLearningCard.itemIndex === itemIndex;
      if (!alreadyQueued && !isCurrentLearning) {
        learningQueue.push({ itemIndex, correctStreak: 0 });
      }
    }

    function recordAnswer(question, correct, usedHint = false) {
      const memory = memoryFor(question.char);
      const today = dailyRecord();
      today.practiceCount += 1;

      const itemIndex = currentItemIndex();

      if (currentLearningCard !== null) {
        // In learning phase — update streak but don't graduate to SRS yet
        if (correct && !usedHint) {
          currentLearningCard.correctStreak += 1;
        } else {
          currentLearningCard.correctStreak = 0;
        }

        const graduated = currentLearningCard.correctStreak >= LEARNING_STEPS_CORRECT_NEEDED;

        if (graduated) {
          // Now commit to long-term SRS
          scheduleReview(memory, true, false);
          // Mark as seen so it counts towards "今日已學"
          if (memory.seen <= 1) {
            // already incremented inside scheduleReview; just ensure daily intro counts it
          }
        } else {
          // Still learning — record an attempt for stats but re-queue
          memory.seen += 1;
          memory.lastSeen = Date.now();
          if (correct && !usedHint) {
            memory.correct += 1;
          } else {
            memory.wrong += 1;
          }
          saveProgress();
          // Re-insert into learning queue
          learningQueue.push({ itemIndex, correctStreak: currentLearningCard.correctStreak });
          learningInsertCountdown = Math.min(LEARNING_REINSERT_AFTER, learningQueue.length > 0 ? LEARNING_REINSERT_AFTER : 0);
        }
      } else {
        // Normal SRS card
        const wasNew = !memory || memory.seen <= 0;
        scheduleReview(memory, correct, usedHint);

        if (!correct || usedHint) {
          // Wrong or hinted: put into learning queue for in-session practice
          enqueueForLearning(itemIndex);
          if (learningInsertCountdown <= 0) learningInsertCountdown = LEARNING_REINSERT_AFTER;
        } else if (wasNew) {
          // First-time correct: still put in learning queue to confirm
          enqueueForLearning(itemIndex);
          if (learningInsertCountdown <= 0) learningInsertCountdown = LEARNING_REINSERT_AFTER;
        }
      }

      updateMemoryText();
      if (recordPanel.classList.contains("show")) renderRecordPanel();
    }

    function rootLabel(letter) {
      return `${letter} ${rootText(letter)}`;
    }

    function clearTimer() {
      if (nextTimer) {
        window.clearTimeout(nextTimer);
        nextTimer = null;
      }
    }

    function restartClass(el, className) {
      el.classList.remove(className);
      void el.offsetWidth;
      el.classList.add(className);
    }

    function renderWord(question) {
      wordEl.setAttribute("aria-label", question.char);
      wordEl.textContent = question.char;
    }

    function updateDeleteButton() {
      deleteButton.disabled = locked || buffer.length === 0;
    }

    function auxiliaryGlyphUrl(id) {
      return `${COMMONS_FILE}Cjrm-${id}.svg`;
    }

    function auxiliaryColor(name) {
      const colors = {
        red: "var(--aux-red)",
        orange: "var(--aux-orange)",
        green: "var(--aux-green)",
        magenta: "var(--aux-magenta)",
        gold: "var(--aux-gold)"
      };
      return colors[name] || "var(--aux-blue)";
    }

    function auxiliarySplitGlyphs(letter) {
      return AUXILIARY_CARD_INFO[letter]?.glyphs || [];
    }

    function auxiliaryGlyphColumns(count) {
      if (count >= 13) return 4;
      return 3;
    }

    function auxiliaryGlyphSize(count, columns) {
      if (count >= 20) return "23px";
      if (count >= 18) return "25px";
      if (count >= 14) return "29px";
      if (columns === 3 && count >= 10) return "32px";
      if (columns === 3) return "35px";
      return "33px";
    }

    function auxiliaryGlyphGap(count, columns) {
      if (columns === 3) {
        return {
          x: count >= 10 ? "8px" : "9px",
          y: count >= 10 ? "4px" : "7px"
        };
      }

      return {
        x: count >= 18 ? "2px" : "3px",
        y: count >= 18 ? "2px" : "3px"
      };
    }

    function auxiliaryBadgePair(letter) {
      const info = AUXILIARY_CARD_INFO[letter];
      if (!info) return "";
      return `
        <span class="aux-badge-pair" aria-label="${info.root} ${letter}">
          <span class="aux-root-badge" data-id="${info.rootId || ""}" style="background:${auxiliaryColor(info.color)}">${info.root}</span>
          <span class="aux-letter-badge">${letter}</span>
        </span>
      `;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function auxiliaryGlyphMarkup(glyph) {
      return `
        <span class="aux-card-glyph-wrap" data-id="${glyph.id}" data-text="${glyph.text}">
          <img class="aux-card-glyph" src="${auxiliaryGlyphUrl(glyph.glyphCode)}" alt="${glyph.text}" loading="eager" decoding="sync" fetchpriority="high">
        </span>
      `;
    }

    function preloadAuxiliaryGlyphs(letter) {
      auxiliarySplitGlyphs(letter).forEach((glyph) => {
        const url = auxiliaryGlyphUrl(glyph.glyphCode);
        if (auxiliaryGlyphPreloadUrls.has(url)) return;
        auxiliaryGlyphPreloadUrls.add(url);
        const img = new Image();
        img.decoding = "async";
        img.src = url;
      });
    }

    function warmAuxiliaryCards() {
      Object.keys(AUXILIARY_CARD_INFO).forEach((letter) => preloadAuxiliaryGlyphs(letter));
    }

    function auxiliarySpecialGrid(letter) {
      const info = AUXILIARY_CARD_INFO[letter];
      if (!info?.notes?.length) return "";
      const note = info.notes[0];
      return `
        <div class="aux-text-grid is-note">
          <div class="aux-description-cell" data-id="${note.id}" data-text="${note.text}">${note.text.replace(/\n/g, "<br>")}</div>
        </div>
      `;
    }

    function hasAuxiliaryCard(letter) {
      return AUXILIARY_CARD_LETTERS.has(letter);
    }

    function auxiliaryCardMarkup(letter, className, alt) {
      if (!hasAuxiliaryCard(letter)) return "";
      preloadAuxiliaryGlyphs(letter);
      let baseMarkup = auxiliaryCardCache.get(letter);

      if (!baseMarkup) {
        const info = AUXILIARY_CARD_INFO[letter];
        if (!info) return "";
        const glyphs = auxiliarySplitGlyphs(letter);
        const columns = auxiliaryGlyphColumns(glyphs.length);
        const gaps = auxiliaryGlyphGap(glyphs.length, columns);
        const body = glyphs.length
          ? `
            <div class="aux-card-grid" style="--aux-glyph-cols:${columns};--aux-glyph-size:${auxiliaryGlyphSize(glyphs.length, columns)};--aux-glyph-gap-x:${gaps.x};--aux-glyph-gap-y:${gaps.y};">
              ${glyphs.map((glyph) => auxiliaryGlyphMarkup(glyph)).join("")}
            </div>
          `
          : auxiliarySpecialGrid(letter);

        baseMarkup = `
          <div class="aux-card" role="img">
            <div class="aux-card-head">${auxiliaryBadgePair(letter)}</div>
            ${body}
          </div>
        `;
        auxiliaryCardCache.set(letter, baseMarkup);
      }

      return baseMarkup
        .replace('class="aux-card"', `class="aux-card ${className}"`)
        .replace('role="img"', `role="img" aria-label="${alt}"`);
    }

    function answerCard(role, label, question) {
      const part = question.decomposition?.parts?.find((item) => item.role === role);
      const letter = part?.letter || (role === "head" ? question.head : question.tail);
      const root = rootText(letter);
      const cardImage = auxiliaryCardMarkup(letter, "answer-card-img", `${root} ${letter} 輔助字型卡`);
      return `
        <div class="answer-card ${role}">
          <div class="answer-label">${label}碼 ${letter} · ${part?.auxText || root}</div>
          <div class="answer-card-img-wrap">
            ${cardImage || `<div class="answer-card-fallback">${root}：重碼鍵</div>`}
          </div>
        </div>
      `;
    }

    function createSearchQuestion(result) {
      return {
        char: result.character,
        head: result.head,
        tail: result.tail,
        decomposition: {
          parts: [
            { role: "head", letter: result.head, auxText: rootText(result.head) },
            { role: "tail", letter: result.tail, auxText: rootText(result.tail) }
          ]
        }
      };
    }

    function enterSearchMode(result) {
      searchModeActive = true;
      clearTimer();
      cancelKeyPress();
      hideKeyHint();
      locked = true;
      answerShown = false;
      renderWord({ char: result.character });
      wordEl.classList.remove("entering", "correct", "shake");
      answerLine.className = "answer-line";
      answerLine.innerHTML = "";
      heroEl.classList.remove("answer-mode");
      heroEl.classList.add("search-mode");

      if (!result.found) {
        answerLine.classList.add("show", "single");
        answerLine.innerHTML = `<div class="answer-search-empty">${escapeHtml(result.message || "查無拆碼")}</div>`;
        return;
      }

      const searchQuestion = createSearchQuestion(result);
      answerLine.innerHTML = `
        ${answerCard("head", "頭", searchQuestion)}
        ${answerCard("tail", "尾", searchQuestion)}
      `;
      answerLine.classList.add("show");
    }

    function leaveSearchMode() {
      if (!searchModeActive) return;
      searchModeActive = false;
      heroEl.classList.remove("search-mode");
      renderQuestion();
    }

    function statusClass(status) {
      if (status === "code") return "is-code";
      if (status === "missing") return "is-missing";
      return "";
    }

    function renderCodePiece(label, value) {
      return `
        <div class="code-piece">
          <div class="code-piece-role">${escapeHtml(label)}</div>
          <div class="code-piece-value">${escapeHtml(value || "?")}</div>
        </div>
      `;
    }

    function renderDecompositionSearchResult(result) {
      decompositionSearchClear.classList.toggle("show", decompositionSearchInput.value.length > 0);

      if (result.status === "empty") {
        decompositionSearchResult.classList.remove("show");
        decompositionSearchResult.innerHTML = "";
        leaveSearchMode();
        return;
      }

      decompositionSearchResult.classList.remove("show");
      decompositionSearchResult.innerHTML = "";
      enterSearchMode(result);
    }

    function runDecompositionSearch() {
      const result = decomposeCharacter(decompositionSearchInput.value);
      renderDecompositionSearchResult(result);
      const target = getFirstHanCharacter(decompositionSearchInput.value);

      if (target && result.status === "missing" && externalCodeIndexStatus !== "ready" && externalCodeIndexStatus !== "failed") {
        ensureExternalCodeIndex().then(() => {
          if (getFirstHanCharacter(decompositionSearchInput.value) === target) {
            renderDecompositionSearchResult(decomposeCharacter(target));
          }
        });
      }
    }

    function clearDecompositionSearch() {
      decompositionSearchInput.value = "";
      decompositionSearchClear.classList.remove("show");
      decompositionSearchResult.classList.remove("show");
      decompositionSearchResult.innerHTML = "";
      leaveSearchMode();
      decompositionSearchInput.focus();
    }

    function showKeyHint(letter, keyEl) {
      const root = rootText(letter);
      const cardImage = auxiliaryCardMarkup(letter, "key-hint-card", `${root} ${letter} 輔助字型卡`);
      keyHintEl.innerHTML = `
        ${cardImage || `<div class="key-hint-fallback">${root} 是重碼鍵，沒有獨立輔助字型卡。</div>`}
      `;
      keyHintEl.classList.add("show");
      keyEl.classList.add("holding");
    }

    function hideKeyHint() {
      keyHintEl.classList.remove("show");
      document.querySelectorAll(".key.holding").forEach((key) => key.classList.remove("holding"));
    }

    function startKeyPress(letter, keyEl) {
      window.clearTimeout(holdTimer);
      holdingKey = letter;
      longPressTriggered = false;
      keyEl.classList.add("active");

      holdTimer = window.setTimeout(() => {
        longPressTriggered = true;
        showKeyHint(letter, keyEl);
      }, 280);
    }

    function finishKeyPress(letter, keyEl) {
      window.clearTimeout(holdTimer);
      holdTimer = null;
      keyEl.classList.remove("active");

      if (holdingKey !== letter) return;
      holdingKey = null;

      if (longPressTriggered) {
        window.setTimeout(hideKeyHint, 760);
        return;
      }

      hideKeyHint();
      pressKey(letter);
    }

    function cancelKeyPress() {
      window.clearTimeout(holdTimer);
      holdTimer = null;
      holdingKey = null;
      longPressTriggered = false;
      hideKeyHint();
      document.querySelectorAll(".key.active").forEach((key) => key.classList.remove("active"));
    }

    function renderKeyboard() {
      keyboardEl.innerHTML = "";
      keyboardEl.appendChild(keyHintEl);

      KEY_ROWS.forEach((row) => {
        const rowEl = document.createElement("div");
        rowEl.className = "key-row";

        row.forEach((letter) => {
          const mainRoot = getMainRoot(letter);
          const key = document.createElement("button");
          key.className = "key";
          key.type = "button";
          key.dataset.key = letter;
          if (mainRoot?.id) key.dataset.id = mainRoot.id;
          key.setAttribute("aria-label", rootLabel(letter));
          key.innerHTML = `<span class="key-letter">${letter}</span><span class="key-root" data-id="${mainRoot?.id || ""}">${rootText(letter)}</span>`;
          key.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            startKeyPress(letter, key);
          });
          key.addEventListener("pointerup", (event) => {
            event.preventDefault();
            finishKeyPress(letter, key);
          });
          key.addEventListener("pointerleave", cancelKeyPress);
          key.addEventListener("pointercancel", cancelKeyPress);
          key.addEventListener("contextmenu", (event) => event.preventDefault());
          rowEl.appendChild(key);
        });

        keyboardEl.appendChild(rowEl);
      });
    }

    function renderBuffer(markBad = false) {
      bufferEl.innerHTML = "";

      [0, 1].forEach((slotIndex) => {
        const slot = document.createElement("div");
        const letter = buffer[slotIndex];
        slot.className = "slot";

        if (letter) {
          slot.classList.add("filled");
          if (markBad) slot.classList.add("bad");
          slot.innerHTML = `${letter}<small data-id="${rootDataId(letter)}">${rootText(letter)}</small>`;
        } else {
          slot.textContent = "—";
        }

        bufferEl.appendChild(slot);
      });

      updateDeleteButton();
    }

    function updateScore() {
      const question = currentQuestion();
      if (!question) {
        const today = dailyRecord();
        roundText.textContent = today.completed ? `已完成今日任務` : `今日任務進行中`;
        updateMemoryText();
        return;
      }
      const today = dailyRecord();
      roundText.textContent = `${todayDisplayText()} · 今日已練 ${today.practiceCount} 次 · 常用字 #${question.rank}`;
      updateMemoryText();
    }

    function renderQuestion() {
      clearTimer();
      cancelKeyPress();
      searchModeActive = false;
      heroEl.classList.remove("search-mode");
      const question = currentQuestion();
      if (!question) {
        // Check if learning queue has cards left
        if (learningQueue.length > 0) {
          currentLearningCard = learningQueue.shift();
          learningInsertCountdown = LEARNING_REINSERT_AFTER;
          renderQuestion();
          return;
        }
        buffer = [];
        locked = true;
        answerShown = false;
        currentRecorded = false;
        hintButton.disabled = true;
        hintButton.textContent = "已完成今日任務";
        hintButton.classList.remove("next");
        heroEl.classList.remove("answer-mode");
        wordEl.className = "word complete";
        wordEl.textContent = "完成";
        wordEl.setAttribute("aria-label", "已完成今日任務");
        answerLine.className = "answer-line";
        answerLine.innerHTML = "";
        renderBuffer();
        updateScore();
        document.querySelectorAll(".key").forEach((key) => key.classList.remove("active"));
        return;
      }
      buffer = [];
      locked = false;
      answerShown = false;
      currentRecorded = false;
      hintButton.disabled = false;
      hintButton.textContent = "不會回答 / 提示";
      hintButton.classList.remove("next");
      heroEl.classList.remove("answer-mode");
      wordEl.className = "word";
      renderWord(question);
      answerLine.className = "answer-line";
      answerLine.innerHTML = "";
      renderBuffer();
      updateScore();
      document.querySelectorAll(".key").forEach((key) => key.classList.remove("active"));
      restartClass(wordEl, "entering");
    }

    function rebuildSession() {
      clearTimer();
      clearDecompositionSearch();
      order = createQuestionOrder();
      index = 0;
      sessionTotal = order.length;
      buffer = [];
      locked = false;
      answerShown = false;
      learningQueue = [];
      currentLearningCard = null;
      learningInsertCountdown = 0;
      renderQuestion();
    }

    function deleteLastInput() {
      if (searchModeActive) return;
      if (locked || buffer.length === 0) return;
      buffer.pop();
      renderBuffer();
    }

    function pressKey(letter) {
      if (searchModeActive) return;
      if (locked || buffer.length >= 2) return;

      const keyEl = document.querySelector(`[data-key="${letter}"]`);
      if (keyEl && !keyEl.classList.contains("active")) {
        keyEl.classList.add("active");
        window.setTimeout(() => keyEl.classList.remove("active"), 110);
      }

      buffer.push(letter);
      renderBuffer();

      if (buffer.length === 2) {
        checkAnswer();
      }
    }

    function checkAnswer() {
      const question = currentQuestion();
      locked = true;
      hintButton.disabled = true;
      deleteButton.disabled = true;

      const correct = buffer[0] === question.head && buffer[1] === question.tail;
      if (correct) {
        score += 1;
        answered += 1;
        currentRecorded = true;
        recordAnswer(question, true);
        updateScore();
        wordEl.classList.remove("entering");
        restartClass(wordEl, "correct");
        nextTimer = window.setTimeout(() => {
          nextQuestion();
        }, 500);
      } else {
        answered += 1;
        currentRecorded = true;
        recordAnswer(question, false);
        updateScore();
        renderBuffer(true);
        revealAnswer("wrong");
      }
    }

    function revealAnswer(reason = "hint") {
      if (searchModeActive) return;
      const question = currentQuestion();
      cancelKeyPress();
      locked = true;
      answerShown = true;
      hintButton.disabled = false;
      hintButton.textContent = "下一題";
      hintButton.classList.add("next");
      deleteButton.disabled = true;

      if (reason === "hint" && !currentRecorded) {
        answered += 1;
        currentRecorded = true;
        recordAnswer(question, false, true);
        updateScore();
      }

      wordEl.classList.remove("entering", "correct");
      restartClass(wordEl, "shake");

      answerLine.innerHTML = `
        ${answerCard("head", "頭", question)}
        ${answerCard("tail", "尾", question)}
      `;
      answerLine.classList.add("show");
      heroEl.classList.add("answer-mode");
    }

    function nextQuestion() {
      clearTimer();

      pickNextCard();

      // If showing a learning card, just render it
      if (currentLearningCard !== null) {
        renderQuestion();
        return;
      }

      // Otherwise we advanced index — check bounds
      if (index >= order.length) {
        // If there are still learning cards pending, keep going
        if (learningQueue.length > 0) {
          currentLearningCard = learningQueue.shift();
          learningInsertCountdown = LEARNING_REINSERT_AFTER;
          renderQuestion();
          return;
        }

        const today = dailyRecord();
        today.completed = isDailyTaskComplete(today);
        if (today.completed) {
          renderQuestion();
          return;
        }
        rebuildSession();
        return;
      }

      renderQuestion();
    }

    hintButton.addEventListener("click", () => {
      if (searchModeActive) return;
      if (answerShown) {
        nextQuestion();
        return;
      }

      if (!locked) revealAnswer("hint");
    });

    settingsButton.addEventListener("click", (event) => {
      event.stopPropagation();
      setSettingsMenu(!settingsMenu.classList.contains("show"));
    });

    settingsMenu.addEventListener("click", (event) => {
      event.stopPropagation();
    });

    recordButton.addEventListener("click", (event) => {
      event.stopPropagation();
      setRecordPanel(true);
    });

    recordPanel.addEventListener("click", closeRecordPanel);

    recordPanel.querySelector(".record-sheet").addEventListener("click", (event) => {
      event.stopPropagation();
    });

    recordCloseButton.addEventListener("click", closeRecordPanel);

    recordTableWrap.addEventListener("click", (event) => {
      const button = event.target.closest("[data-sort-key]");
      if (!button) return;

      const key = button.dataset.sortKey;
      recordSort = {
        key,
        direction: recordSort.key === key && recordSort.direction === "desc" ? "asc" : "desc"
      };
      renderRecordPanel();
    });

    dailyLimitSelect.addEventListener("change", () => {
      settings.dailyLimit = Number(dailyLimitSelect.value) || 10;
      saveSettings();
      trimTodayIntroducedToLimit();
      closeSettingsMenu();
      rebuildSession();
    });

    resetProgressButton.addEventListener("click", resetLearningProgress);

    learnMoreButton.addEventListener("click", learnMoreNewWords);

    deleteButton.addEventListener("click", deleteLastInput);

    decompositionSearchForm.addEventListener("submit", (event) => {
      event.preventDefault();
      runDecompositionSearch();
    });

    decompositionSearchInput.addEventListener("input", runDecompositionSearch);
    decompositionSearchClear.addEventListener("click", clearDecompositionSearch);

    document.addEventListener("click", closeSettingsMenu);

    ["touchstart", "selectstart", "dragstart"].forEach((eventName) => {
      keyboardEl.addEventListener(eventName, (event) => {
        event.preventDefault();
      }, { passive: false });
    });

    window.addEventListener("keydown", (event) => {
      if (event.target === decompositionSearchInput) return;

      if (event.key === "Escape") {
        closeRecordPanel();
        closeSettingsMenu();
        hideKeyHint();
        clearDecompositionSearch();
        return;
      }

      if (event.key === "Backspace" || event.key === "Delete") {
        event.preventDefault();
        deleteLastInput();
        return;
      }

      if (event.key === "Enter" && answerShown) {
        event.preventDefault();
        nextQuestion();
        return;
      }

      const key = event.key.toUpperCase();
      if (getMainRoot(key)) {
        event.preventDefault();
        pressKey(key);
      }
    });

    document.addEventListener("gesturestart", (event) => event.preventDefault());

    window.decomposeCharacter = decomposeCharacter;

    renderKeyboard();
    renderQuestion();
    warmAuxiliaryCards();
    ensureExternalCodeIndex();
  </script>
</body>
</html>
